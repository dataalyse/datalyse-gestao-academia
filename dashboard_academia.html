<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Executiva · Academia | Datalyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   CONFIG / TEMA — tokens de cor e tipografia
   ===================================================================== */
:root{
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1C1C1F; --border:#2A2A2E;
  --text:#F2F0EE; --text-muted:#9A979A; --text-dim:#5E5B5F;
  --red-700:#6E1F24; --red-600:#8E2A30; --red-500:#A63A40; --red-400:#C0595E; --red-300:#D48A8D; --red-200:#E6BDBE;
  --gray-500:#6B686C; --gray-300:#B5B2B4; --grid:#222225;
  --radius:14px;
  --f-head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh}
.num,.kpi-val,.t td,output{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--red-400);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
.masthead{border-top:2px solid var(--red-600);background:linear-gradient(180deg,#0F0F11 0%,var(--bg) 100%);border-bottom:1px solid var(--border)}
.mh-inner{max-width:1600px;margin:0 auto;padding:14px 28px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs actions";align-items:center;gap:14px 28px}
.brand{grid-area:brand;display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;flex:none}
.brand-name{font-family:var(--f-head);font-weight:700;font-size:19px;letter-spacing:.01em;line-height:1.1}
.brand h1{margin:2px 0 0;font:500 11.5px var(--f-body);color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs{grid-area:tabs;display:flex;gap:2px;justify-content:center;min-width:0}
.tab{background:none;border:0;color:var(--text-muted);font:500 13.5px var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer;position:relative;white-space:nowrap;transition:color .15s,background .15s}
.tab:hover{color:var(--text);background:var(--surface)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--red-500)}
.tabs-mobile{grid-area:tabs;display:none}
.actions{grid-area:actions;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.updated{font-size:11.5px;color:var(--text-muted);text-align:right;line-height:1.3;white-space:nowrap}
.updated b{color:var(--text);font-weight:600;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--red-600);background:var(--red-700);color:var(--text);font:600 13px var(--f-body);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--red-600)}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2);border-color:#3A3A3F}

/* ---------- Banner / toast / tooltip ---------- */
.banner{max-width:1600px;margin:14px auto 0;padding:0 28px}
.banner-in{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,rgba(110,31,36,.35),rgba(20,20,22,.9));border:1px solid rgba(166,58,64,.5);border-radius:12px;padding:12px 14px;color:var(--text)}
.banner-in .i{color:var(--red-300);margin-top:2px}
.banner-in b{font-size:13px}
.banner-in ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--red-200)}
.banner-x{margin-left:auto;background:none;border:0;color:var(--text-muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.banner-x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--red-500);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 16px 40px rgba(0,0,0,.55);max-width:calc(100vw - 32px)}
#tip{position:fixed;z-index:130;max-width:300px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.55);pointer-events:none}
#tip b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--red-300);margin-bottom:3px}
#tip .dec{margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}

/* ---------- Filtros ---------- */
.filterbar{position:sticky;top:0;z-index:40;background:rgba(11,11,12,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.fb-inner{max-width:1600px;margin:0 auto;padding:10px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;position:relative}
.fb-main{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dd{display:flex;align-items:center;gap:8px;min-width:0}
.dd-label{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;white-space:nowrap}
.dd-ctl{position:relative;min-width:0}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:150px;width:100%;height:34px;padding:0 10px 0 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font:500 13px var(--f-body);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.dd-btn:hover{border-color:#3A3A3F}
.dd-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd.is-set .dd-btn{border-color:var(--red-600);box-shadow:inset 0 0 0 1px rgba(166,58,64,.25)}
.dd-caret{width:12px;height:12px;fill:none;stroke:var(--red-500);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex:none}
.dd.open .dd-caret{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-height:300px;overflow:auto;margin:0;padding:6px;list-style:none;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 44px rgba(0,0,0,.6);z-index:70}
.dd-menu.right{left:auto;right:0}
.dd-menu li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text)}
.dd-menu li::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.dd-menu li[aria-selected="true"]{color:var(--red-200);font-weight:600}
.dd-menu li[aria-selected="true"]::before{background:var(--red-500)}
.dd-menu li:hover,.dd-menu li:focus{background:var(--red-700);color:var(--text);outline:none}
.fb-more{position:relative}
.btn-more{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--text);font:500 13px var(--f-body);cursor:pointer}
.btn-more:hover,.btn-more[aria-expanded="true"]{background:var(--surface-2);border-color:#3A3A3F}
.btn-more .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red-600);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.more-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:60;width:440px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;box-shadow:0 22px 54px rgba(0,0,0,.65)}
.more-panel .dd{flex-direction:column;align-items:stretch;gap:5px}
.more-panel .dd-btn{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 10px;border-radius:999px;background:rgba(166,58,64,.14);border:1px solid rgba(166,58,64,.45);color:var(--red-200);font:500 12px var(--f-body);cursor:pointer}
.chip:hover{background:rgba(166,58,64,.25)}
.chip .x{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.3);font-size:12px;line-height:1}
.btn-clear{margin-left:auto;background:none;border:0;color:var(--text-muted);font:500 12.5px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.btn-clear:hover{color:var(--text)}

/* ---------- Páginas e grade ---------- */
main{max-width:1600px;margin:0 auto;padding:22px 28px 36px}
.page{display:none;animation:fade .35s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 16px;flex-wrap:wrap}
.page-head h2{font-family:var(--f-head);font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--text-muted);font-size:13px}
.page-tag{font-size:11.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.row-2{grid-row:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-width:0;transition:box-shadow .2s,border-color .2s;position:relative}
.card:hover{box-shadow:0 0 0 1px rgba(166,58,64,.25)}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.card-h h3{margin:0;font:600 14.5px var(--f-head);letter-spacing:.005em}
.card-h p{margin:3px 0 0;color:var(--text-muted);font-size:12px}
.nf{flex:none;font-size:10.5px;color:var(--text-muted);border:1px dashed #3A3A3F;border-radius:999px;padding:3px 9px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:13px;text-align:center;border:1px dashed var(--border);border-radius:10px}
.empty svg{width:28px;height:28px;stroke:var(--text-dim)}
.legend-inline{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11.5px;color:var(--text-muted)}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}
.legend-inline i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend-inline i.dash{height:0;width:16px;border-top:2px dashed var(--gray-300);border-radius:0}
.legend-inline i.solid{height:0;width:16px;border-top:2px solid var(--gray-300);border-radius:0}
.callout{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:8px 12px;border-radius:9px;background:rgba(166,58,64,.1);border:1px solid rgba(166,58,64,.35);color:var(--red-200);margin-bottom:6px}
.callout.ok{background:rgba(181,178,180,.08);border-color:rgba(181,178,180,.3);color:var(--gray-300)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis[data-n="12"]{--n:6}.kpis[data-n="6"]{--n:6}.kpis[data-n="5"]{--n:5}.kpis[data-n="4"]{--n:4}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 13px 18px;position:relative;overflow:hidden;min-width:0;transition:box-shadow .2s}
.kpi:hover{box-shadow:0 0 0 1px rgba(166,58,64,.25)}
.kpi::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--red-600)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-label{font-size:11px;color:#C9C6C8;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-val{font:600 25px/1.15 var(--f-head);margin:8px 0 6px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-val.neg{color:var(--red-300)}
.kpi-val.txt{font-size:20px}
.kpi-ref{font-size:11.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:3px 8px;line-height:1.35}
.kpi-ref strong{color:var(--text);font-weight:600}
.tr{font-weight:600}
.tr.bad{color:var(--red-300)}
.tr.good{color:var(--gray-300)}
.info{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:var(--text-muted);font:700 10px/1 var(--f-head);cursor:help;display:grid;place-items:center;padding:0}
.info:hover,.info:focus-visible{color:var(--text);border-color:var(--red-500)}

/* ---------- Alertas ---------- */
.alerts{display:grid;gap:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gray-500);border-radius:10px}
.alert.high{border-left-color:var(--red-500)}
.alert.mid{border-left-color:var(--red-300)}
.al-ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(166,58,64,.14);color:var(--red-300)}
.alert.info .al-ic{background:rgba(181,178,180,.1);color:var(--gray-300)}
.al-sev{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--text-muted);text-transform:uppercase}
.al-t{font-weight:600;font-size:13.5px;margin-top:1px}
.al-s{font-size:12px;color:var(--text-muted);margin-top:2px}
.al-a{font-size:12px;color:var(--text);margin-top:6px}
.al-a::before{content:"→ ";color:var(--red-300);font-weight:700}

/* ---------- Tabelas ---------- */
.tbl-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text-muted);width:min(320px,100%)}
.search:focus-within{border-color:var(--red-600)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:500 13px var(--f-body);outline:none}
.tbl-count{font-size:12px;color:var(--text-muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.t th{background:var(--surface-2);color:var(--text-muted);font-weight:600;text-align:left;padding:9px 12px;white-space:nowrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.t th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.t th button:focus-visible{outline:2px solid var(--red-400);outline-offset:2px;border-radius:3px}
.t th .s{color:var(--red-400);font-size:9px}
.t td{padding:9px 12px;border-top:1px solid var(--border);white-space:nowrap}
.t .n{text-align:right}
.t tbody tr{transition:background .12s}
.t tbody tr:hover td{background:#19191C}
.t tr.click{cursor:pointer}
.t tr.click:focus-visible{outline:2px solid var(--red-400);outline-offset:-2px}
.neg{color:var(--red-300)}
.muted{color:var(--text-muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge.ativo{background:rgba(181,178,180,.12);color:var(--gray-300);border:1px solid rgba(181,178,180,.3)}
.badge.cancelado{background:rgba(166,58,64,.16);color:var(--red-300);border:1px solid rgba(166,58,64,.5)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.pager button{min-width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font:500 12px var(--f-body)}
.pager button[aria-current="true"]{background:var(--red-700);border-color:var(--red-600)}
.pager button:disabled{opacity:.4;cursor:default}
.t.dre td:first-child,.t.dre th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--border)}
.t.dre th:first-child{background:var(--surface-2)}
.t.dre .proj{background:#18181B}
.t.dre th.proj{background:#202024}
.t.dre tr.tot td{font-weight:600;color:var(--text)}
.t.dre tr.res td{font-weight:700;border-top:1px solid #3A3A3F}
.t.dre tr.ded td:not(:first-child){color:var(--text-muted)}
.t.dre .ph{display:block;font-size:9px;letter-spacing:.08em;color:var(--text-dim);margin-top:2px}
.t.dre th.proj .ph{color:var(--red-300)}
.mbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mbar .trk{width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;flex:none}
.mbar .fil{height:100%;border-radius:3px}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-muted)}
.rank.top{background:var(--red-700);color:var(--text)}

/* ---------- Motivos de perda ---------- */
.lossrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-bottom:14px}
.lossrow .lt{font-size:13px}
.lossrow .lv{font:600 13px var(--f-head)}
.lossrow .bar{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden}
.lossrow .bar i{display:block;height:100%;border-radius:4px;background:var(--red-500)}
.loss-total{font-size:12px;color:var(--text-muted);margin:2px 0 16px}
.loss-total b{font:600 26px var(--f-head);color:var(--text);display:block}

/* ---------- Simulador ---------- */
.sim{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.sim-field{display:flex;flex-direction:column;gap:8px}
.sim-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sim-top label{font-size:13px;color:var(--text);display:flex;gap:6px;align-items:center}
.sim-top output{font:600 14px var(--f-head);color:var(--red-200)}
.sim-range{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted)}
.sim-note{font-size:11.5px;color:var(--text-muted);line-height:1.5;border-top:1px solid var(--border);padding-top:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;margin:6px 0;background:linear-gradient(to right,var(--red-500) 0,var(--red-600) var(--p,50%),var(--border) var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);border:3px solid var(--red-600);box-shadow:0 0 0 4px rgba(166,58,64,.2);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--text);border:3px solid var(--red-600);box-shadow:0 0 0 4px rgba(166,58,64,.2)}
input[type=range]:focus-visible{outline:2px solid var(--red-400);outline-offset:6px}

/* ---------- Rodapé ---------- */
footer{border-top:1px solid var(--border)}
.ft-in{max-width:1600px;margin:0 auto;padding:20px 28px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--text-muted);font-size:12px}

/* ---------- Responsivo ---------- */
@media (max-width:1439px){
  .mh-inner{grid-template-columns:1fr auto;grid-template-areas:"brand actions" "tabs tabs"}
  .tabs{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);padding-top:8px;margin:0 -6px}
  .kpis[data-n="12"]{--n:4}
}
@media (max-width:1199px){
  .span-3,.span-4,.span-5,.span-6{grid-column:span 6}
  .span-7,.span-8{grid-column:span 12}
  .row-2{grid-row:auto}
  .kpis[data-n="6"]{--n:3}
}
@media (max-width:899px){
  .kpis[data-n]{--n:3}
  .span-3,.span-4,.span-5,.span-6{grid-column:span 12}
}
@media (max-width:759px){
  .mh-inner{padding:12px 16px;gap:10px 12px}
  .tabs{display:none}
  .tabs-mobile{display:block}
  .tabs-mobile .dd{flex-direction:row}
  .tabs-mobile .dd-ctl{flex:1}
  .updated{display:none}
  .actions .lbl{display:none}
  .btn{padding:0 11px}
  .brand h1{font-size:10.5px}
  main{padding:16px 16px 28px}
  .fb-inner{padding:10px 16px;gap:10px}
  .filterbar{position:static}
  .fb-main{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .fb-main .dd,.more-panel .dd{flex-direction:column;align-items:stretch;gap:4px}
  .dd-btn{min-width:0}
  .fb-more{position:static}
  .more-panel{left:16px;right:16px;width:auto;grid-template-columns:1fr}
  .btn-clear{margin-left:0}
  .banner{padding:0 16px}
  .kpis[data-n]{--n:2}
  .kpi{padding:12px 12px 11px 14px}
  .kpi-val{font-size:20px}
  .kpi-val.txt{font-size:16px}
  .card{padding:14px}
  .page-head h2{font-size:20px}
  .ft-in{padding:18px 16px 24px}
}

@media (max-width:419px){
  .brand h1{white-space:normal;line-height:1.3}
  .actions{gap:6px}
}
@media (max-width:359px){
  .kpis[data-n]{--n:1}
}

/* ---------- Impressão / PDF ---------- */
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#0B0B0C!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .filterbar,.actions,.tabs,.tabs-mobile,.banner,#tip,.toast,.tbl-tools,.pager,.btn-clear{display:none!important}
  .mh-inner{grid-template-columns:1fr;grid-template-areas:"brand"}
  main{max-width:none;padding:10px 0}
  .page{display:block!important;break-after:page;animation:none}
  .page:last-of-type{break-after:auto}
  .card,.kpi,.alert{break-inside:avoid}
  .card:hover,.kpi:hover{box-shadow:none}
}
body.printing main{max-width:1060px}
body.printing .page{display:block}

const PREM_DEFAULT = {mensMusc:150, mensLutas:190, mensBale:140, taxaReceb:.97, churn:.05, cac:100, margem:.65, cresc:.03, custoFixo:18000, meta:300, dias:26};
const PREM_RULES = [
  ['mensMusc', s => s.includes('mensalidade') && s.includes('muscula')],
  ['mensLutas', s => s.includes('mensalidade') && s.includes('luta')],
  ['mensBale', s => s.includes('mensalidade') && s.includes('bale')],
  ['taxaReceb', s => s.includes('recebimento')],
  ['churn', s => s.includes('churn')],
  ['cac', s => /\bcac\b/.test(s)],
  ['margem', s => s.includes('margem')],
  ['cresc', s => s.includes('crescimento')],
  ['custoFixo', s => s.includes('custo') && s.includes('fixo')],
  ['meta', s => s.includes('meta')],
  ['dias', s => s.includes('dias')],
];
const PCT_KEYS = ['taxaReceb','churn','margem','cresc'];
const PREM_NAMES = {mensMusc:'Mensalidade média musculação', mensLutas:'Mensalidade média lutas', mensBale:'Mensalidade média balé', taxaReceb:'Taxa média de recebimento', churn:'Churn mensal estimado', cac:'CAC estimado', margem:'Margem de contribuição média', cresc:'Crescimento mensal projetado', custoFixo:'Custos fixos mensais', meta:'Meta de alunos ativos', dias:'Dias de funcionamento/mês'};

function num(v){
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).replace(/[R$\s% ]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
function yes(v){ return ['sim','s','yes','y','1','true','x','ok'].includes(norm(v)); }
function parseDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number'){ if (v < 1000) return null; const u = new Date(Math.round((v - 25569) * 86400000)); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2]-1, +m[1]); }
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(+s);
  return null;
}
function parseMes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'string'){
    const s = v.trim(); let m;
    if ((m = s.match(/^(\d{1,2})[\/\-](\d{4})$/))) return `${m[2]}-${pad(+m[1])}`;
    if ((m = s.match(/^(\d{4})[\/\-](\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}`;
    if ((m = norm(s).match(/^([a-z]{3})[a-z]*[\/\- ]*(\d{2,4})$/))){ const i = MES.map(norm).indexOf(m[1]); if (i >= 0){ let y = +m[2]; if (y < 100) y += 2000; return `${y}-${pad(i+1)}`; } }
  }
  const d = parseDate(v); return d ? mkey(d) : null;
}
function getSheet(book, name){ const k = Object.keys(book).find(s => norm(s).replace(/[\s_]/g,'') === norm(name).replace(/[\s_]/g,'')); return k ? book[k] : null; }
function readTable(book, name, warn){
  const spec = SPEC[name], rows = getSheet(book, name);
  if (!rows){ warn.push(`Aba “${name}” não encontrada — as seções que dependem dela ficarão vazias.`); return []; }
  const h = rows.findIndex(r => r && r.filter(v => v != null && String(v).trim() !== '').length >= 2);
  if (h < 0){ warn.push(`Aba “${name}” está vazia.`); return []; }
  const header = rows[h].map(norm), idx = {}, missing = [];
  for (const [key, def] of Object.entries(spec)){
    let i = header.findIndex(x => def.a.includes(x));
    if (i < 0) i = header.findIndex(x => def.a.some(a => x.startsWith(a)));
    idx[key] = i; if (i < 0 && def.req) missing.push(def.a[0]);
  }
  if (missing.length) warn.push(`Aba “${name}”: coluna(s) não encontrada(s) — ${missing.join(', ')}.`);
  const out = [];
  for (let r = h+1; r < rows.length; r++){
    const row = rows[r];
    if (!row || row.every(v => v == null || String(v).trim() === '')) continue;
    const o = {}; for (const k in idx) o[k] = idx[k] >= 0 ? row[idx[k]] : null; out.push(o);
  }
  return out;
}
function statusAluno(v){ const n = norm(v); if (n.startsWith('ativ')) return 'Ativo'; if (n.startsWith('cancel') || n.startsWith('inativ')) return 'Cancelado'; return str(v) || '—'; }
function parseFaixa(s){
  const n = norm(s); let m;
  if ((m = n.match(/(\d{1,2})\s*(?:h|:\d\d)?\s*(?:-|–|a|ate|as)\s*(\d{1,2})/))) return [+m[1], +m[2]];
  if ((m = n.match(/(\d{1,2})/))) return [+m[1], +m[1]+1];
  return null;
}
function expandDays(s){
  const n = norm(s).replace(/–/g,'-'); let m;
  if ((m = n.match(/^([a-z]{3})[a-z]*\.?\s*(?:-|a|ate)\s*([a-z]{3})/))){
    const a = DAY_KEYS.indexOf(m[1]), b = DAY_KEYS.indexOf(m[2]);
    if (a >= 0 && b >= a) return DAY_KEYS.slice(a, b+1).map((_,i) => a+i);
  }
  return uniq(n.split(/[,\/;e ]+/).map(t => DAY_KEYS.indexOf(t.slice(0,3))).filter(i => i >= 0));
}

function loadBook(book){
  const warn = [];
  /* Premissas — lidas pelo nome do parâmetro, não pela linha */
  const prem = {...PREM_DEFAULT}, found = new Set();
  for (const r of readTable(book, 'Premissas', warn)){
    const p = norm(r.param); const rule = PREM_RULES.find(([k, fn]) => !found.has(k) && fn(p));
    if (!rule) continue; let v = num(r.valor);
    if (PCT_KEYS.includes(rule[0]) && v > 1) v = v/100;
    prem[rule[0]] = v; found.add(rule[0]);
  }
  const miss = Object.keys(PREM_DEFAULT).filter(k => !found.has(k));
  if (miss.length && getSheet(book,'Premissas')) warn.push(`Premissas não encontradas (usando valor padrão): ${miss.map(k => PREM_NAMES[k]).join(', ')}.`);
  const mensDe = mod => { const n = norm(mod); return n.includes('muscula') ? prem.mensMusc : n.includes('bale') ? prem.mensBale : prem.mensLutas; };

  const alunos = readTable(book, 'Alunos', warn).map((r, i) => {
    const matricula = parseDate(r.matricula);
    return {id: r.id ?? i+1, nome: str(r.nome) || `Aluno ${i+1}`, modalidade: str(r.modalidade) || '—', plano: str(r.plano) || '—', matricula, mk: mkey(matricula), mensalidade: num(r.mensalidade), status: statusAluno(r.status), cancelamento: parseDate(r.cancelamento), origem: str(r.origem) || '—'};
  });
  const turmas = readTable(book, 'Turmas', warn).map(r => {
    const cap = num(r.capacidade), mat = num(r.matriculados), custo = num(r.custo), modalidade = str(r.modalidade) || '—';
    const ocup = cap > 0 ? mat/cap : null, mens = mensDe(modalidade), rec = mat * mens;
    return {codigo: str(r.codigo), modalidade, dia: str(r.dia), horario: str(r.horario), professor: str(r.professor) || '—', capacidade: cap, matriculados: mat, presenca: num(r.presenca), custo, ocup, mens, recPot: rec, margem: rec - custo, margemPct: rec > 0 ? (rec - custo)/rec : null,
      status: ocup == null ? 'Sem turma' : ocup >= .8 ? 'Alta' : ocup >= .5 ? 'Média' : 'Baixa', days: expandDays(r.dia), hour: (parseFaixa(r.horario) || [null])[0]};
  });
  const receitas = readTable(book, 'Receitas', warn).map(r => {
    const data = parseDate(r.data);
    return {data, mes: parseMes(r.mes) || mkey(data), modalidade: str(r.modalidade) || '—', tipo: str(r.tipo) || '—', cliente: str(r.cliente), previsto: num(r.previsto), recebido: num(r.recebido), forma: str(r.forma) || '—', status: str(r.status)};
  });
  const despesas = readTable(book, 'Despesas', warn).map(r => {
    const data = parseDate(r.data);
    return {data, mes: parseMes(r.mes) || mkey(data), categoria: str(r.categoria) || 'Outros', descricao: str(r.descricao), tipo: norm(r.tipo).startsWith('fix') ? 'Fixa' : 'Variável', centro: str(r.centro) || '—', valor: num(r.valor), pago: yes(r.pago)};
  });
  const leads = readTable(book, 'Leads', warn).map(r => {
    const data = parseDate(r.data), experimental = yes(r.experimental), compareceu = yes(r.compareceu), matriculou = yes(r.matriculou);
    let status = str(r.status); if (!status) status = matriculou ? 'Matriculado' : !compareceu ? 'Sem comparecimento' : 'Não convertido';
    return {data, mk: mkey(data), nome: str(r.nome), origem: str(r.origem) || '—', interesse: str(r.interesse) || '—', experimental, compareceu, matriculou, valorPlano: num(r.valorPlano), cac: num(r.cac), status};
  });
  const churnRows = readTable(book, 'Churn_Cancelamentos', warn).map(r => ({base: r.base, novos: num(r.novos), cancel: num(r.cancel)}));
  const ocupacao = readTable(book, 'Ocupacao_Horarios', warn).map(r => {
    const cap = num(r.capacidade), mat = num(r.matriculados), ocup = cap > 0 ? mat/cap : null;
    return {horario: str(r.horario), faixa: parseFaixa(r.horario), capacidade: cap, matriculados: mat, presenca: num(r.presenca), ocup, status: ocup == null ? 'Sem turma' : ocup >= .8 ? 'Alta' : ocup >= .5 ? 'Média' : 'Baixa'};
  });
  return {data: {prem, alunos, turmas, receitas, despesas, leads, churnRows, ocupacao}, warn};
}

/* =====================================================================
   CÁLCULOS (KPIs) — fórmulas corrigidas pela Datalyse
   ===================================================================== */
let DATA = null, BASE = null;
function colorMap(names){ const m = new Map(); names.forEach((n,i) => m.set(n, PALETTE[i % PALETTE.length])); return n => m.get(n) || C.g500; }

function buildBase(D){
  const P = D.prem;
  /* Mês 1 = primeiro mês encontrado em Receitas/Despesas */
  let fin = uniq([...D.receitas.map(r => r.mes), ...D.despesas.map(d => d.mes)]).sort();
  let first = fin[0] || uniq([...D.leads.map(l => l.mk), ...D.alunos.map(a => a.mk)]).sort()[0] || mkey(new Date());
  const months = Array.from({length:12}, (_,i) => addMonths(first, i));
  const labels = months.map(mlabel);

  /* DRE 12M — realizado usa Receitas/Despesas; projetado usa premissas */
  const dre = []; let lastRB = null, lastRealIdx = -1;
  const ativosAll = D.alunos.filter(a => a.status === 'Ativo');
  const ticketAll = ativosAll.length ? sum(ativosAll, 'mensalidade') / ativosAll.length : 0;
  months.forEach((k, i) => {
    const rec = D.receitas.filter(r => r.mes === k), des = D.despesas.filter(d => d.mes === k);
    const real = rec.length > 0 || des.length > 0;
    let rb, inad, cv, cf;
    if (real){
      rb = sum(rec, 'previsto'); inad = rb - sum(rec, 'recebido');
      const rl = rb - inad;
      cv = des.length ? sum(des.filter(d => d.tipo === 'Variável'), 'valor') : rl * (1 - P.margem);
      cf = des.length ? sum(des.filter(d => d.tipo === 'Fixa'), 'valor') : P.custoFixo;
      lastRB = rb; lastRealIdx = i;
    } else {
      const base = lastRB != null ? lastRB : ativosAll.length * ticketAll;
      rb = base * Math.pow(1 + P.cresc, i - lastRealIdx);
      inad = rb * (1 - P.taxaReceb);
      cv = (rb - inad) * (1 - P.margem);
      cf = P.custoFixo;
    }
    const rl = rb - inad, mc = rl - cv, res = mc - cf;
    dre.push({k, label: labels[i], real, rb, inad, rl, cv, mc, cf, res, mop: rl ? res/rl : 0});
  });
  /* Fluxo de caixa */
  let saldo = 0;
  const caixa = dre.map(m => { const ini = saldo; const ent = m.rl, sai = m.cv + m.cf; saldo = ini + ent - sai; return {ini, ent, sai, liq: ent - sai, fim: saldo, real: m.real}; });
  /* Churn 12M — só Base inicial do mês 1, Novos e Cancelamentos */
  const churn12 = []; let b = D.churnRows.length ? num(D.churnRows[0].base) : 0;
  D.churnRows.forEach((r, i) => { const ini = b, fim = ini + r.novos - r.cancel; const ch = ini > 0 ? r.cancel/ini : 0; churn12.push({label: i < 12 ? labels[i] : mlabel(addMonths(first, i)), ini, novos: r.novos, cancel: r.cancel, fim, churn: ch, ret: 1 - ch}); b = fim; });

  /* Opções de filtros (dos dados) */
  const modalidades = uniq([...D.turmas.map(t => t.modalidade), ...D.alunos.map(a => a.modalidade), ...D.leads.map(l => l.interesse), ...D.receitas.map(r => r.modalidade)]).filter(m => !['diversas','—','-','geral','todas'].includes(norm(m)));
  const origens = uniq([...D.alunos.map(a => a.origem), ...D.leads.map(l => l.origem)]).filter(o => o !== '—');
  const opts = {
    periodo: uniq([...fin, ...D.leads.map(l => l.mk), ...D.alunos.map(a => a.mk)]).sort().map(k => ({value:k, label:mlabel(k)})),
    modalidade: modalidades.map(v => ({value:v, label:v})),
    professor: uniq(D.turmas.map(t => t.professor)).map(v => ({value:v, label:v})),
    plano: uniq(D.alunos.map(a => a.plano)).filter(v => v !== '—').map(v => ({value:v, label:v})),
    status: uniq(D.alunos.map(a => a.status)).sort().map(v => ({value:v, label:v})),
    origem: origens.map(v => ({value:v, label:v})),
    forma: uniq(D.receitas.map(r => r.forma)).filter(v => v !== '—').map(v => ({value:v, label:v})),
    centro: uniq(D.despesas.map(d => d.centro)).filter(v => v !== '—').map(v => ({value:v, label:v})),
  };
  const colors = {
    modalidade: colorMap(modalidades), origem: colorMap(origens), plano: colorMap(opts.plano.map(o => o.value)),
    forma: colorMap(opts.forma.map(o => o.value)), centro: colorMap(opts.centro.map(o => o.value)),
    fixvar: n => n === 'Fixa' ? C.g300 : C.r500, status: n => n === 'Ativo' ? C.g300 : C.r500,
  };
  const allDates = [...D.alunos.flatMap(a => [a.matricula, a.cancelamento]), ...D.receitas.map(r => r.data), ...D.despesas.map(d => d.data), ...D.leads.map(l => l.data)].filter(Boolean);
  const lastDate = allDates.length ? new Date(Math.max(...allDates.map(d => d.getTime()))) : null;
  return {months, labels, dre, caixa, churn12, lastRealIdx, opts, colors, lastDate, ativosAll: ativosAll.length, ticketAll};
}

function computeView(){
  const f = state.filters, D = DATA, P = D.prem;
  const inMod = m => !f.modalidade || m === f.modalidade;
  const al = D.alunos.filter(a => inMod(a.modalidade) && (!f.plano || a.plano === f.plano) && (!f.status || a.status === f.status) && (!f.origem || a.origem === f.origem) && (!f.periodo || a.mk === f.periodo));
  const rec = D.receitas.filter(r => (!f.periodo || r.mes === f.periodo) && inMod(r.modalidade) && (!f.forma || r.forma === f.forma));
  const des = D.despesas.filter(d => (!f.periodo || d.mes === f.periodo) && (!f.centro || d.centro === f.centro));
  const leads = D.leads.filter(l => (!f.periodo || l.mk === f.periodo) && inMod(l.interesse) && (!f.origem || l.origem === f.origem));
  const tur = D.turmas.filter(t => inMod(t.modalidade) && (!f.professor || t.professor === f.professor));
  const ativos = al.filter(a => a.status === 'Ativo'), canc = al.filter(a => a.status === 'Cancelado');
  const ticket = ativos.length ? sum(ativos, 'mensalidade') / ativos.length : 0;                 // Correção 2
  const churnReal = (ativos.length + canc.length) ? canc.length / (ativos.length + canc.length) : 0; // Correção 4
  const prev = sum(rec, 'previsto'), receb = sum(rec, 'recebido');
  const inad = prev ? (prev - receb) / prev : 0;                                                     // Correção 8
  const novosLeads = leads.filter(l => l.matriculou).length;
  const cacReal = novosLeads ? sum(leads, 'cac') / novosLeads : null;
  const cac = cacReal ?? P.cac;
  const ltv = P.churn > 0 ? ticket * P.margem / P.churn : 0;                                         // Correção 1
  const ltvCac = cac > 0 ? ltv / cac : 0;                                                            // Correção 8
  const peR = P.margem > 0 ? P.custoFixo / P.margem : 0;
  const peAl = ticket > 0 ? Math.ceil(peR / ticket) : null;                                          // Correção 7
  const tCap = tur.filter(t => t.capacidade > 0);
  const ocupMedia = avg(tCap.map(t => t.ocup));                                                      // Correção 6
  /* Fotografia da base no fim do mês de referência e do mês anterior (comparativo) */
  const refK = f.periodo || BASE.months[Math.max(0, BASE.lastRealIdx)];
  const endOf = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0, 23, 59); };
  const snap = k => { const d = endOf(k); const at = D.alunos.filter(a => inMod(a.modalidade) && (!f.plano || a.plano === f.plano) && (!f.origem || a.origem === f.origem) && a.matricula && a.matricula <= d && (a.status !== 'Cancelado' || (a.cancelamento && a.cancelamento > d))); return {n: at.length, mrr: sum(at, 'mensalidade')}; };
  const snapCur = snap(refK), snapPrev = snap(addMonths(refK, -1));
  const mrr = sum(ativos, 'mensalidade');
  return {mrr, snapCur, snapPrev, al, ativos, canc, rec, des, leads, tur, tCap, ticket, churnReal, prev, receb, inad, novosLeads, cacReal, cac, ltv, ltvCac, peR, peAl, ocupMedia, despTot: sum(des, 'valor')};
}

function projection(s){
  const P = DATA.prem;
  /* O crescimento da planilha é líquido com o churn da premissa; churn acima/abaixo dela altera o líquido */
  const gNet = Math.max(-0.99, s.cresc - (s.churn - P.churn));
  const a0 = BASE.ativosAll, pe = s.margem > 0 ? s.custoFixo / s.margem : Infinity;
  const rows = []; let acum = 0;
  for (let m = 0; m < 12; m++){ const alunos = a0 * Math.pow(1 + gNet, m), fat = alunos * s.ticket; acum += fat; rows.push({alunos, fat, acum, res: fat * s.margem - s.custoFixo}); }
  return {rows, pe, gNet, beIdx: rows.findIndex(r => r.fat >= pe), metaIdx: rows.findIndex(r => r.alunos >= P.meta), alunosPE: s.ticket > 0 ? Math.ceil(pe / s.ticket) : null,
    ltv: s.churn > 0 ? s.ticket * s.margem / s.churn : 0};
}

const state = {filters: Object.fromEntries(Object.keys(FILTERS).map(k => [k, null])), tab: 'overview', sim: null};
const ddRefs = {};
let ddSeq = 0;

function makeDropdown({label, options, value, allLabel, onChange}){
  const wrap = document.createElement('div'); wrap.className = 'dd';
  const id = 'dd' + (++ddSeq);
  wrap.innerHTML = `<span class="dd-label" id="${id}-l">${esc(label)}</span><div class="dd-ctl"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${id}-l ${id}-v"><span class="dd-val" id="${id}-v"></span><svg class="dd-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg></button><ul class="dd-menu" role="listbox" aria-labelledby="${id}-l" hidden></ul></div>`;
  const btn = wrap.querySelector('.dd-btn'), menu = wrap.querySelector('.dd-menu'), valEl = wrap.querySelector('.dd-val');
  let all = allLabel != null ? [{value:null, label:allLabel}, ...options] : options;
  function paint(){
    const cur = all.find(o => o.value === value) || all[0];
    valEl.textContent = cur ? cur.label : '—';
    wrap.classList.toggle('is-set', allLabel != null && value != null);
    menu.innerHTML = all.map((o, i) => `<li role="option" tabindex="-1" data-i="${i}" aria-selected="${o.value === value}">${esc(o.label)}</li>`).join('');
  }
  function open(){
    closeAllDropdowns(wrap); menu.hidden = false; wrap.classList.add('open'); btn.setAttribute('aria-expanded','true');
    menu.classList.remove('right'); const r = menu.getBoundingClientRect(); if (r.right > window.innerWidth - 8) menu.classList.add('right');
    (menu.querySelector('[aria-selected="true"]') || menu.firstElementChild)?.focus();
  }
  function close(focusBtn){ menu.hidden = true; wrap.classList.remove('open'); btn.setAttribute('aria-expanded','false'); if (focusBtn) btn.focus(); }
  function pick(i){ const o = all[i]; if (!o) return; close(true); if (o.value !== value){ value = o.value; paint(); onChange(value); } }
  btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
  btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); open(); } });
  menu.addEventListener('click', e => { e.stopPropagation(); const li = e.target.closest('li'); if (li) pick(+li.dataset.i); });
  menu.addEventListener('keydown', e => {
    const items = [...menu.children], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); items[Math.min(i+1, items.length-1)]?.focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); items[Math.max(i-1, 0)]?.focus(); }
    else if (e.key === 'Home'){ e.preventDefault(); items[0]?.focus(); }
    else if (e.key === 'End'){ e.preventDefault(); items[items.length-1]?.focus(); }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(i); }
    else if (e.key === 'Escape'){ e.preventDefault(); close(true); }
    else if (e.key === 'Tab'){ close(); }
  });
  wrap._set = v => { value = v; paint(); };
  wrap._setOptions = (opts, v) => { all = allLabel != null ? [{value:null, label:allLabel}, ...opts] : opts; value = v; paint(); };
  wrap._close = () => close();
  paint();
  return wrap;
}
function closeAllDropdowns(except){ document.querySelectorAll('.dd.open').forEach(d => { if (d !== except) d._close(); }); }

function buildFilterUI(){
  const main = document.getElementById('fbMain'), more = document.getElementById('morePanel');

  }
}
function activeFilters(){ return Object.keys(FILTERS).filter(k => state.filters[k] != null); }
function filterValueLabel(k){ const v = state.filters[k]; return k === 'periodo' ? mlabel(v) : v; }
function setFilter(k, v){ state.filters[k] = v; ddRefs[k]?._set(v); afterFilterChange(); }
function toggleFilter(k, v){
  if (!BASE.opts[k].some(o => o.value === v)) return;
  setFilter(k, state.filters[k] === v ? null : v);
  toast(state.filters[k] ? `Filtro aplicado: ${FILTERS[k].label} = ${filterValueLabel(k)}` : `Filtro removido: ${FILTERS[k].label}`);
}
function clearFilters(){ for (const k in FILTERS){ state.filters[k] = null; ddRefs[k]?._set(null); } afterFilterChange(); }
function afterFilterChange(){ renderChips(); save(); renderAll(); }
function renderChips(){
  const act = activeFilters();

}
function sanitizeFilters(){ for (const k in FILTERS){ const v = state.filters[k]; if (v != null && !BASE.opts[k].some(o => o.value === v)) state.filters[k] = null; } }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify({filters: state.filters, tab: state.tab})); } catch (e) {} }
function restore(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && s.filters) for (const k in FILTERS) state.filters[k] = s.filters[k] ?? null;
    if (s && PAGES.some(p => p.id === s.tab)) state.tab = s.tab;
  } catch (e) {}
}

function pieOption(id, items, {name, fmt = F.int, color, donut = false, centerText} = {}){

function pieOrBar(id, items, cfg){

const prevKpi = {};

    ${k.sub ? `<div class="kpi-sub" title="${esc(k.sub)}">${esc(k.sub)}</div>` : ''}
    <div class="kpi-val${k.neg ? ' neg' : ''}${k.txt ? ' txt' : ''}">${k.v == null ? '—' : k.f(k.v)}</div>
    <div class="kpi-ref">${k.trend ? `<span class="tr ${k.trend.bad ? 'bad' : 'good'}">${k.trend.up ? '▲' : '▼'} ${k.trend.t}</span>` : ''}${k.ref ? `<span>${k.ref}</span>` : ''}</div></div>`).join('');
  list.forEach(k => {
    const key = pid + k.id, node = el.querySelector(`[data-k="${k.id}"] .kpi-val`);
    if (k.v != null && !k.noAnim && typeof k.v === 'number') countUp(node, prevKpi[key] ?? 0, k.v, k.f);
    prevKpi[key] = typeof k.v === 'number' ? k.v : 0;
  });
}
function countUp(node, from, to, fmt){
  if (!ANIM || from === to){ node.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 650;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); node.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const tipEl = document.getElementById('tip');
function showTip(t){
  const dec = t.dataset.dec;
  if (dec) tipEl.innerHTML = `<b>Como é calculado</b>${esc(t.dataset.tip)}<div class="dec"><b>Que decisão apoia</b>${esc(dec)}</div>`;
  else tipEl.textContent = t.dataset.tip;
  tipEl.hidden = false;
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  let top = r.bottom + 8; if (top + h > window.innerHeight - 8) top = r.top - h - 8;
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function hideTip(){ tipEl.hidden = true; }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });

function renderOverview(V){
  const P = DATA.prem, B = BASE, at = V.ativos.length;
  const cacTrend = V.cacReal != null && P.cac ? {up: V.cacReal > P.cac, bad: V.cacReal > P.cac, t: `${F.pct(Math.abs(V.cacReal/P.cac - 1))} vs premissa`} : null;
  const momN = momTrend(V.snapCur.n, V.snapPrev.n, d => `${d > 0 ? '+' : '−'}${F.int(Math.abs(d))} alunos`);
  const momR = momTrend(V.snapCur.mrr, V.snapPrev.mrr, (d, p) => F.pct(Math.abs(d) / p));
  renderKpis('overview', [
    {id:'ativos', label:'Alunos ativos', sub:'Base atual de alunos', v:at, f:F.int, trend:momN, ref:`<strong>${F.pct(P.meta ? at/P.meta : 0)}</strong> da meta de ${F.int(P.meta)}`, tip:'Contagem de alunos com Status = Ativo na aba Alunos (respeita os filtros).', dec:'Abaixo da meta: concentre a captação nos canais que mais convertem (página Comercial) e acompanhe o churn.'},
    {id:'mrr', label:'MRR', sub:'Receita recorrente mensal', v:V.mrr, f:F.money, trend:momR, ref:`mensalidades de ${F.int(at)} aluno${at === 1 ? '' : 's'} ativo${at === 1 ? '' : 's'}`, tip:'Monthly Recurring Revenue: soma das mensalidades dos alunos ativos, a receita que se repete todo mês, sem vendas avulsas de produtos.', dec:'É a parte previsível do caixa. Use-a para planejar contratações e investimentos; para crescer, aumente a base ou o ticket.'},
    {id:'receb', label:'Receita recebida', sub:'Entrada de caixa no período', v:V.receb, f:F.money, ref:`de ${F.money(V.prev)} previstos`, tip:'Soma de “Valor Recebido” na aba Receitas (mensalidades + produtos).', dec:'Muito abaixo do previsto indica falha na cobrança: acione os pendentes e incentive o pagamento recorrente.'},
    {id:'ticket', label:'Ticket médio', sub:'Mensalidade média por aluno', v:V.ticket, f:F.brl, ref:'só alunos ativos', tip:'Soma das mensalidades dos alunos ATIVOS ÷ nº de ativos.', dec:'Ticket baixo: ofereça planos combinados (ex.: Multitreino) ou revise a tabela de preços.'},
    {id:'churn', label:'Churn Rate', sub:'Taxa de cancelamento', v:V.churnReal, f:F.pct, trend: V.churnReal > P.churn ? {up:true, bad:true, t:`acima da premissa (${F.pct(P.churn)})`} : {up:false, bad:false, t:`dentro da premissa (${F.pct(P.churn)})`}, tip:'Cancelados ÷ (ativos + cancelados) no período. As séries de 12 meses usam a aba Churn_Cancelamentos e o LTV usa o churn mensal da premissa.', dec:'Se subir, contate os alunos com baixa frequência e reforce o acompanhamento nos primeiros 60 dias.'},
    {id:'cac', label:'CAC', sub: V.cacReal != null ? 'Custo de aquisição por aluno' : 'Custo de aquisição (premissa)', v:V.cac, f:F.brl, trend:cacTrend, ref: V.cacReal != null ? `premissa ${F.brl(P.cac)}` : 'sem matrículas no funil', tip:'Customer Acquisition Cost: soma do CAC dos leads ÷ leads matriculados. Sem matrículas no filtro, usa o CAC estimado das premissas.', dec:'CAC alto: corte os canais caros e concentre o investimento nos que mais convertem.'},
    {id:'ltv', label:'LTV', sub:'Valor gerado pelo aluno', v:V.ltv, f:F.money, ref:`${F.brl(V.ticket)} × ${F.pct0(P.margem)} ÷ ${F.pct0(P.churn)}`, tip:'Lifetime Value: ticket médio × margem de contribuição ÷ churn mensal (premissa).', dec:'Cresce quando o aluno fica mais tempo ou paga mais: invista em retenção e em planos de maior valor.'},
    {id:'ltvcac', label:'LTV/CAC', sub:'Retorno do custo de aquisição', v:V.ltvCac, f:F.x, trend: V.ltvCac >= 3 ? {up:true, bad:false, t:'saudável (≥ 3x)'} : {up:false, bad:true, t:'abaixo de 3x'}, tip:'Quanto cada R$ 1 investido para conquistar um aluno retorna em margem ao longo da vida dele.', dec:'Abaixo de 3x, a aquisição está cara. Acima de 5x, há espaço para investir mais em marketing.'},
    {id:'pe', label:'Break-even', sub:'Ponto de equilíbrio mensal', v:V.peR, f:F.brl0, ref: V.peAl != null ? `<strong>≈ ${F.int(V.peAl)} alunos</strong> · margem ${F.pct0(P.margem)}` : `margem ${F.pct0(P.margem)}`, tip:'Receita mensal necessária = custos fixos ÷ margem de contribuição. Em alunos = break-even ÷ ticket médio.', dec:'É a meta mínima do comercial: abaixo desse faturamento a academia opera no prejuízo.'},
    {id:'ocup', label:'Taxa de ocupação', sub:'Uso da capacidade das turmas', v:V.ocupMedia, f:F.pct, ref:`${V.tCap.length} turmas com capacidade`, trend: V.ocupMedia >= .8 ? {up:true, bad:false, t:'alta'} : V.ocupMedia < .5 ? {up:false, bad:true, t:'baixa'} : null, tip:'Média de Matriculados ÷ Capacidade, apenas turmas com capacidade > 0.', dec:'Abaixo de 50%: junte turmas ou mude o horário. Acima de 80%: abra novas turmas.'},
    {id:'novos', label:'Novos alunos', sub:'Matrículas no período', v:V.al.length, f:F.int, ref:`${F.int(V.novosLeads)} vindos do funil de leads`, tip:'Matrículas registradas na aba Alunos no período filtrado. Referência: leads com “Matriculou = Sim”.', dec:'Compare com os cancelamentos: a base só cresce se as matrículas superarem as saídas.'},
    {id:'inad', label:'Inadimplência', sub:'Receita prevista não recebida', v:V.inad, f:F.pct, trend: V.inad > (1 - P.taxaReceb) ? {up:true, bad:true, t:`acima de ${F.pct(1 - P.taxaReceb)}`} : null, ref:`${F.money(V.prev - V.receb)} em aberto`, tip:'(Valor previsto − valor recebido) ÷ valor previsto, na aba Receitas.', dec:'Acima de 3%: automatize lembretes de cobrança e priorize PIX ou cartão recorrente.'},
  ]);

  /* Gauge */
  const meta = P.meta || 1;
  draw('gauge', {
    tooltip:{formatter: () => `Alunos ativos: <b>${F.int(at)}</b><br>Meta: ${F.int(meta)} · ${F.pct(at/meta)}<br>Faltam <b>${F.int(Math.max(0, meta - at))}</b> alunos`},
    series:[{type:'gauge', startAngle:180, endAngle:0, min:0, max:meta, splitNumber:5, radius:'98%', center:['50%','68%'],
      axisLine:{lineStyle:{width:18, color:[[.5,'#242428'],[.8,'#302F34'],[1,'#3E3C41']]}},
      progress:{show:true, width:18, itemStyle:{color:C.r600}},
      pointer:{length:'66%', width:5, itemStyle:{color:C.r500}},
      anchor:{show:true, size:16, itemStyle:{color:C.r500, borderColor:C.surface, borderWidth:4}},
      axisTick:{show:false}, splitLine:{distance:-18, length:18, lineStyle:{color:C.surface, width:3}},
      axisLabel:{distance:26, color:C.muted, fontSize:10.5, formatter: v => F.int(v)},
      title:{show:false},
      detail:{offsetCenter:[0,'28%'], valueAnimation:false, formatter: () => `{v|${F.int(at)}}{u| / ${F.int(meta)}}\n{s|${F.pct(at/meta)} da meta}`, rich:{v:{fontFamily:'Sora', fontSize:30, fontWeight:600, color:C.text}, u:{fontSize:13, color:C.muted, padding:[8,0,0,0]}, s:{fontSize:11.5, color:C.muted, padding:[6,0,0,0]}}},
      data:[{value: Math.min(at, meta), name:'Alunos ativos'}]}],
  }, {aria:`Velocímetro: ${at} alunos ativos para uma meta de ${meta}`});

  /* Linha resultado 12M */
  const dre = B.dre, L = B.labels, lr = B.lastRealIdx;
  const realS = dre.map(m => m.real ? m.res : null), projS = dre.map((m, i) => (!m.real || i === lr) ? m.res : null);
  const negArea = dre.map(m => Math.min(0, m.res));
  const nNeg = dre.filter(m => m.res < 0).length;
  draw('result12', {
    grid:{left:8, right:16, top:24, bottom:8, containLabel:true},
    tooltip:{trigger:'axis', axisPointer:{type:'line', lineStyle:{color:'#3A3A3F'}}, formatter: ps => { const m = dre[ps[0].dataIndex]; return `<b>${m.label}</b> · ${m.real ? 'realizado' : 'projetado'}<br>Resultado: <b>${F.money(m.res)}</b><br><span style="color:${C.muted}">Receita líquida ${F.money(m.rl)} · Custos ${F.money(m.cv + m.cf)}</span>`; }},
    xAxis:{type:'category', data:L, boundaryGap:false},
    yAxis:{type:'value', axisLabel:{formatter:F.brlc}},
    series:[
      {name:'_area', type:'line', data:negArea, symbol:'none', lineStyle:{width:0}, areaStyle:{color:'rgba(166,58,64,.16)', origin:'auto'}, silent:true, z:1, tooltip:{show:false}},
      {name:'Realizado', type:'line', data:realS, lineStyle:{color:C.r500, width:2.5}, itemStyle:{color:C.r500}, symbolSize:9, z:3,
        markLine:{silent:true, symbol:'none', data:[{yAxis:0}, ...(periodIdx() >= 0 ? [{xAxis:periodIdx()}] : [])], lineStyle:{color:C.g500, type:'solid', width:1}, label:{show:false}}},
      {name:'Projetado', type:'line', data:projS, lineStyle:{color:C.r400, width:2, type:'dashed'}, itemStyle:{color:C.r400}, symbolSize:6, z:2},
    ],
    legend:{top:0, right:0, data:['Realizado','Projetado']},
  }, {aria:`Resultado operacional: negativo em ${nNeg} de 12 meses`});

  /* Pizza modalidade */
  pieOrBar('pieMod', groupSum(V.tur, t => t.modalidade, t => t.matriculados), {name:'Matrículas em turmas', fmt: v => `${F.int(v)} matrículas`, color: B.colors.modalidade, filter:'modalidade'});

  renderAlerts(V);
}

function renderAlerts(V){
  const P = DATA.prem, B = BASE, A = [];
  const neg = B.dre.filter(m => m.res < 0).length, acc = sum(B.dre, 'res');
  if (neg === 12) A.push({sev:'high', ic:'down', t:'Resultado operacional negativo em todos os 12 meses', s:`Déficit acumulado de ${F.brl0(Math.abs(acc))} no horizonte (realizado + projetado).`, a:'Use o simulador (Projeções) para testar mais alunos, reajuste de ticket e corte de custos.'});
  else if (neg > 0) A.push({sev:'high', ic:'down', t:`Resultado operacional negativo em ${neg} de 12 meses`, s:`Resultado acumulado de ${F.brl0(acc)}.`, a:'Use o simulador (Projeções) para testar as alavancas de receita e custo.'});
  const pctMeta = P.meta ? V.ativos.length / P.meta : 0;
  A.push({sev: pctMeta < .5 ? 'high' : pctMeta < 1 ? 'mid' : 'info', ic:'target', t:`Base atual = ${F.pct(pctMeta)} da meta`, s:`${F.int(V.ativos.length)} de ${F.int(P.meta)} alunos ativos · faltam ${F.int(Math.max(0, P.meta - V.ativos.length))}.`, a:'Concentre a captação nos canais com maior taxa de conversão (página Comercial).'});
  const low = V.tCap.filter(t => t.ocup < .5).sort((a, b) => a.ocup - b.ocup)[0];
  if (low) A.push({sev:'mid', ic:'grid', t:`Turma ${low.codigo} com ocupação de ${F.pct0(low.ocup)}`, s:`${F.int(low.matriculados)} de ${F.int(low.capacidade)} vagas · ${low.modalidade} · ${low.dia} ${low.horario} · ${low.professor}.`, a:'Avalie juntar com outra turma, mudar o horário ou fazer uma campanha para a modalidade.'});
  if (V.prev && V.inad > (1 - P.taxaReceb)) A.push({sev:'mid', ic:'wallet', t:`Inadimplência de ${F.pct(V.inad)}`, s:`${F.money(V.prev - V.receb)} em aberto — acima dos ${F.pct(1 - P.taxaReceb)} esperados pela premissa.`, a:'Acione os pendentes e ofereça PIX ou cartão recorrente.'});
  if (V.ltvCac > 0 && V.ltvCac < 3) A.push({sev:'high', ic:'scale', t:`LTV/CAC abaixo de 3 (${F.x(V.ltvCac)})`, s:'A aquisição está cara frente à margem gerada por aluno.', a:'Corte os canais mais caros e invista em retenção.'});
  const mods = groupMod(V.tur).filter(m => m.margem < 0).sort((a, b) => a.margem - b.margem);
  if (mods.length) A.push({sev:'mid', ic:'down', t:`${mods[0].name} opera com margem negativa`, s:`${F.brl0(mods[0].margem)}/mês: custo das turmas maior que a receita potencial.`, a:'Revise o custo das turmas ou o preço da modalidade.'});
  const sem = DATA.ocupacao.filter(o => o.capacidade <= 0);
  if (sem.length) A.push({sev:'info', ic:'clock', t:`${sem.length} faixa${sem.length > 1 ? 's' : ''} horária${sem.length > 1 ? 's' : ''} sem turma`, s:`${sem.map(o => o.horario).join(', ')} — oportunidade de grade.`, a:'Teste novas turmas nesses horários para usar o espaço ocioso.'});
  if (V.ltvCac >= 3) A.push({sev:'info', ic:'check', t:`LTV/CAC saudável: ${F.x(V.ltvCac)}`, s:'Cada R$ 1 em aquisição retorna mais de R$ 3 em margem.', a:'Há espaço para investir mais em captação de alunos.'});
  const list = A.slice(0, 4), sevLabel = {high:'Crítico', mid:'Atenção', info:'Informativo'};
  setBadge('alerts');
  document.getElementById('hb-alerts').innerHTML = `<div class="alerts">${list.map(a => `<div class="alert ${a.sev}"><span class="al-ic">${icon(a.ic)}</span><div><div class="al-sev">${sevLabel[a.sev]}</div><div class="al-t">${esc(a.t)}</div><div class="al-s">${esc(a.s)}</div>${a.a ? `<div class="al-a">${esc(a.a)}</div>` : ''}</div></div>`).join('')}</div>`;
}

/* ---------- 7.2 Financeiro ---------- */
function renderFinance(V){
  const P = DATA.prem, B = BASE, f = state.filters;
  const res = V.receb - V.despTot;
  renderKpis('finance', [
    {id:'prev', label:'Receita prevista', sub:'Faturamento esperado', v:V.prev, f:F.money, ref:`${F.int(V.rec.length)} lançamentos`, tip:'Soma de “Valor Previsto” na aba Receitas.', dec:'É a referência do mês: compare com o recebido para medir a eficiência da cobrança.'},
    {id:'receb', label:'Receita recebida', sub:'Entrada de caixa', v:V.receb, f:F.money, ref:`${F.pct(V.prev ? V.receb/V.prev : 0)} do previsto`, tip:'Soma de “Valor Recebido” na aba Receitas.', dec:'Muito abaixo do previsto indica falha na cobrança: acione os pendentes e incentive o pagamento recorrente.'},
    {id:'desp', label:'Despesas totais', sub:'Custos fixos + variáveis', v:V.despTot, f:F.money, ref:`${F.int(V.des.length)} lançamentos`, tip:'Soma de “Valor” na aba Despesas.', dec:'Veja as categorias que mais pesam (gráfico abaixo) e ataque as maiores primeiro.'},
    {id:'res', label: f.periodo ? `Resultado · ${mlabel(f.periodo)}` : 'Resultado do período', sub:'Lucro ou prejuízo de caixa', v:res, f:F.money, neg: res < 0, trend: res < 0 ? {up:false, bad:true, t:'déficit'} : {up:true, bad:false, t:'superávit'}, tip:'Receita recebida − despesas totais (visão caixa, respeita os filtros).', dec:'Negativo: o caixa está sendo consumido. Aumente a receita (alunos, ticket) ou reduza custos fixos.'},
    {id:'inad', label:'Inadimplência', sub:'Receita prevista não recebida', v:V.inad, f:F.pct, ref:`${F.money(V.prev - V.receb)} pendentes`, trend: V.inad > (1 - P.taxaReceb) ? {up:true, bad:true, t:`meta ${F.pct(1 - P.taxaReceb)}`} : null, tip:'(Previsto − recebido) ÷ previsto.', dec:'Acima de 3%: automatize lembretes de cobrança e priorize PIX ou cartão recorrente.'},
  ]);

  /* Waterfall: período (só filtro de período) */
  const recP = DATA.receitas.filter(r => !f.periodo || r.mes === f.periodo), desP = DATA.despesas.filter(d => !f.periodo || d.mes === f.periodo);
  document.getElementById('sub-waterfall').textContent = (f.periodo ? `${mlabel(f.periodo)} · ` : 'Acumulado de todos os meses · ') + 'valores realizados (Receitas e Despesas)';
  if (!recP.length && !desP.length) draw('waterfall', {}, {empty:true});
  else {
    const rb = sum(recP, 'previsto'), inad = rb - sum(recP, 'recebido'), cv = sum(desP.filter(d => d.tipo === 'Variável'), 'valor'), cf = sum(desP.filter(d => d.tipo === 'Fixa'), 'valor');
    const steps = [{n:'Receita bruta', k:'tot', v:rb}, {n:'(−) Inadimplência', k:'d', v:-inad}, {n:'(−) Custos variáveis', k:'d', v:-cv}, {n:'Margem de contribuição', k:'tot', v:rb - inad - cv}, {n:'(−) Custos fixos', k:'d', v:-cf}, {n:'Resultado operacional', k:'tot', v:rb - inad - cv - cf}];
    let run = 0;
    const data = steps.map((s, i) => { let lo, hi; if (s.k === 'tot'){ lo = 0; hi = s.v; run = s.v; } else { lo = run; hi = run + s.v; run = hi; } return [i, Math.min(lo, hi), Math.max(lo, hi), s.v, run]; });
    const narrow = W('waterfall') < 520;
    draw('waterfall', {
      grid:{left:6, right:10, top:30, bottom:6, containLabel:true},
      xAxis:{type:'category', data: steps.map(s => s.n), axisLabel:{interval:0, fontSize: narrow ? 9.5 : 11, width: narrow ? 52 : 86, overflow:'break', lineHeight:13}},
      yAxis:{type:'value', axisLabel:{formatter:F.brlc}},
      tooltip:{trigger:'item', formatter: p => `<b>${steps[p.data[0]].n}</b><br>${F.money(p.data[3])}${rb ? `<br><span style="color:${C.muted}">${F.pct(Math.abs(p.data[3]) / rb)} da receita bruta</span>` : ''}`},
      series:[{type:'custom', encode:{x:0, y:[1,2]}, data, renderItem: (params, api) => {
        const i = api.value(0), lo = api.value(1), hi = api.value(2), val = api.value(3), end = api.value(4), k = steps[i].k;
        const a = api.coord([i, lo]), b = api.coord([i, hi]), bw = api.size([1, 0])[0] * .56;
        const x = a[0] - bw/2, y = Math.min(a[1], b[1]), h = Math.max(2, Math.abs(a[1] - b[1]));
        const fill = k === 'tot' ? (val >= 0 ? C.g300 : C.r500) : C.r700;
        const ch = [{type:'rect', shape:{x, y, width:bw, height:h, r:3}, style:{fill, stroke: k === 'd' ? C.r500 : null, lineWidth:1}},
          {type:'text', style:{text:F.brlc(val), x:a[0], y:y - 6, align:'center', verticalAlign:'bottom', fill:C.text, font:`600 ${narrow ? 10 : 11}px Inter, sans-serif`}}];
        if (i < steps.length - 1){ const yE = api.coord([i, end])[1], nx = api.coord([i + 1, end])[0]; ch.push({type:'line', shape:{x1:x + bw, y1:yE, x2:nx - bw/2, y2:yE}, style:{stroke:C.dim, lineDash:[3,3], lineWidth:1}}); }
        return {type:'group', children:ch};
      }}],
    }, {aria:`Cascata da DRE: resultado operacional de ${F.money(steps[5].v)}`});
  }

  /* Combo 12M */
  const dre = B.dre, lr = B.lastRealIdx, peR = V.peR;
  draw('combo12', {
    grid:{left:8, right:12, top:36, bottom:8, containLabel:true},
    legend:{top:0, left:0, data:['Receita líquida','Custos totais','Ponto de equilíbrio']},
    tooltip: axisTip(F.money),
    xAxis:{type:'category', data:B.labels},
    yAxis:{type:'value', axisLabel:{formatter:F.brlc}},
    series:[
      {name:'Receita líquida', type:'bar', barMaxWidth:26, itemStyle:{color:C.r500}, data: dre.map((m, i) => ({value:m.rl, itemStyle:{color: m.real ? C.r500 : 'rgba(166,58,64,.42)', opacity: dim(i), borderRadius:[4,4,0,0]}}))},
      {name:'Custos totais', type:'line', data: dre.map(m => m.real ? m.cv + m.cf : null), itemStyle:{color:C.g300}, lineStyle:{color:C.g300}},
      {name:'Custos totais', type:'line', data: dre.map((m, i) => (!m.real || i === lr) ? m.cv + m.cf : null), itemStyle:{color:C.g300}, lineStyle:{color:C.g300, type:'dashed'}, symbolSize:5},
      {name:'Ponto de equilíbrio', type:'line', data: dre.map(() => peR), symbol:'none', itemStyle:{color:C.r300}, lineStyle:{color:C.r300, type:[6,4], width:1.5}},
    ],
  });

  /* Barras: despesas por categoria */
  const cats = groupSum(V.des, d => d.categoria, d => d.valor).filter(c => c.value > 0).sort((a, b) => b.value - a.value);
  draw('catBar', cats.length ? hbarOption(cats, {fmt:F.brl0}) : {}, {empty: !cats.length});

  pieOrBar('centroPie', groupSum(V.des, d => d.centro, d => d.valor), {name:'Despesas por centro de custo', fmt:F.brl0, color:B.colors.centro, filter:'centro'});

  const fv = groupSum(V.des, d => d.tipo, d => d.valor).filter(x => x.value > 0).sort((a, b) => a.name.localeCompare(b.name));
  draw('fixVar', fv.length ? pieOption('fixVar', fv, {name:'Fixas × variáveis', fmt:F.brl0, color:B.colors.fixvar, donut:true, centerText:[F.brlc(V.despTot), 'total']}) : {}, {empty: !fv.length});

  pieOrBar('formaPie', groupSum(V.rec, r => r.forma, r => r.previsto), {name:'Receita por forma de pagamento', fmt:F.money, color:B.colors.forma, filter:'forma'});

  /* Área: saldo acumulado */
  const cx = B.caixa;
  draw('cash', {
    grid:{left:8, right:16, top:30, bottom:8, containLabel:true},
    legend:{top:0, left:0, data:['Realizado','Projetado']},
    tooltip:{trigger:'axis', axisPointer:{type:'line', lineStyle:{color:'#3A3A3F'}}, formatter: ps => { const i = ps[0].dataIndex, c = cx[i]; return `<b>${B.labels[i]}</b> · ${c.real ? 'realizado' : 'projetado'}<br>Saldo final: <b>${F.money(c.fim)}</b><br><span style="color:${C.muted}">Entradas ${F.money(c.ent)} · Saídas ${F.money(c.sai)}</span>`; }},
    xAxis:{type:'category', data:B.labels, boundaryGap:false},
    yAxis:{type:'value', axisLabel:{formatter:F.brlc}},
    series:[
      {name:'Realizado', type:'line', data: cx.map(c => c.real ? c.fim : null), itemStyle:{color:C.r500}, lineStyle:{color:C.r500, width:2.5}, areaStyle:{color:gradient(.35), origin:'auto'}, ...pLine()},
      {name:'Projetado', type:'line', data: cx.map((c, i) => (!c.real || i === lr) ? c.fim : null), itemStyle:{color:C.r400}, lineStyle:{color:C.r400, type:'dashed'}, symbolSize:5, areaStyle:{color:gradient(.22), origin:'auto'}},
    ],
  });

  renderDreTable();
}

function renderDreTable(){
  const B = BASE, dre = B.dre, p = periodIdx();
  const rows = [['Receita bruta','rb',''],['(−) Inadimplência','inad','ded'],['Receita líquida','rl','tot'],['(−) Custos variáveis','cv','ded'],['Margem de contribuição','mc','tot'],['(−) Custos fixos','cf','ded'],['Resultado operacional','res','res'],['Margem operacional','mop','pct']];
  const tot = k => sum(dre, k);
  const cell = (v, k, cls) => { const neg = (k === 'res' || k === 'mc' || k === 'mop') && v < 0; return `<td class="n${cls}${neg ? ' neg' : ''}">${k === 'mop' ? F.pct(v) : F.brl0(v)}</td>`; };
  setBadge('dreTable');
  document.getElementById('hb-dreTable').innerHTML = `<div class="tbl-wrap"><table class="t dre"><thead><tr><th>Linha da DRE</th>${dre.map((m, i) => `<th class="n${m.real ? '' : ' proj'}"${p === i ? ` style="color:${C.r200}"` : ''}>${m.label}<span class="ph">${m.real ? 'REALIZADO' : 'PROJETADO'}</span></th>`).join('')}<th class="n">Total 12M<span class="ph">&nbsp;</span></th></tr></thead>
  <tbody>${rows.map(([n, k, c]) => `<tr class="${c}"><td>${n}</td>${dre.map(m => cell(m[k], k, m.real ? '' : ' proj')).join('')}${cell(k === 'mop' ? (tot('rl') ? tot('res') / tot('rl') : 0) : tot(k), k, '')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- 7.3 Alunos & Retenção ---------- */
function daysSince(a){ const ref = a.status === 'Cancelado' && a.cancelamento ? a.cancelamento : new Date(); return a.matricula ? Math.max(0, Math.round((ref - a.matricula) / 86400000)) : null; }
function renderStudents(V){
  const B = BASE, ativos = V.ativos;
  const tempo = avg(ativos.map(daysSince).filter(d => d != null));
  renderKpis('students', [
    {id:'base', label:'Base ativa', sub:'Alunos com matrícula ativa', v:ativos.length, f:F.int, ref:`${F.int(V.al.length)} alunos no filtro`, tip:'Alunos com Status = Ativo.', dec:'É o motor da receita recorrente (MRR): acompanhe junto com a meta de alunos.'},
    {id:'canc', label:'Cancelamentos', sub:'Alunos que saíram', v:V.canc.length, f:F.int, ref: V.canc.length ? `último em ${F.date(V.canc.map(a => a.cancelamento).filter(Boolean).sort((a, b) => b - a)[0])}` : 'nenhum cancelamento', tip:'Alunos com Status = Cancelado no filtro atual.', dec:'Investigue os motivos (horário, preço, atendimento) e crie uma ação de reconquista.'},
    {id:'churn', label:'Churn Rate', sub:'Taxa de cancelamento', v:V.churnReal, f:F.pct, trend: V.churnReal > DATA.prem.churn ? {up:true, bad:true, t:`premissa ${F.pct(DATA.prem.churn)}`} : null, tip:'Cancelados ÷ (ativos + cancelados).', dec:'Se subir, contate os alunos com baixa frequência e reforce o acompanhamento nos primeiros 60 dias.'},
    {id:'ret', label:'Retention Rate', sub:'Taxa de retenção', v:(V.al.length ? 1 - V.churnReal : 0), f:F.pct, ref:'1 − churn rate', tip:'Percentual de alunos que permanecem: 1 − churn rate.', dec:'Quanto maior, maior o LTV. Acompanhamento de treino e metas pessoais aumentam a permanência.'},
    {id:'tempo', label:'Tempo médio de casa', sub:'Permanência média dos ativos', v:tempo, f: v => `${F.int(v)} dias`, ref:'desde a matrícula', tip:'Média de dias entre a data de matrícula e hoje, considerando somente alunos ativos.', dec:'Os primeiros meses são os mais críticos: reforce o contato com quem tem menos de 60 dias de casa.'},
  ]);

  const ch = B.churn12;
  if (!ch.length){ draw('churnLines', {}, {empty:true}); draw('movStack', {}, {empty:true}); }
  else {
    const L = ch.map(c => c.label);
    const churnMax = Math.max(...ch.map(c => c.churn)), retMin = Math.min(...ch.map(c => c.ret));
    draw('churnLines', {
      grid:{left:8, right:8, top:44, bottom:8, containLabel:true},
      legend:{top:0, left:0, data:['Churn %','Retenção %']},
      tooltip: axisTip(F.pct),
      xAxis:{type:'category', data:L, boundaryGap:false},
      yAxis:[{type:'value', name:'Churn', min:0, max: Math.max(.01, Math.ceil(churnMax * 1.6 * 100) / 100), axisLabel:{formatter: v => F.pct0(v)}, nameTextStyle:{align:'left'}},
             {type:'value', name:'Retenção', min: Math.max(0, Math.floor((retMin - .02) * 100) / 100), max:1, axisLabel:{formatter: v => F.pct0(v)}, splitLine:{show:false}, nameTextStyle:{align:'right'}}],
      series:[
        {name:'Churn %', type:'line', yAxisIndex:0, data: ch.map(c => c.churn), itemStyle:{color:C.r500}, lineStyle:{color:C.r500, width:2.5}, ...pLine()},
        {name:'Retenção %', type:'line', yAxisIndex:1, data: ch.map(c => c.ret), itemStyle:{color:C.g300}, lineStyle:{color:C.g300, width:2}, symbol:'emptyCircle'},
      ],
    });
    draw('movStack', {
      grid:{left:8, right:8, top:44, bottom:8, containLabel:true},
      legend:{top:0, left:0, data:['Novos alunos','Cancelamentos','Base final']},
      tooltip: axisTip(F.int),
      xAxis:{type:'category', data:L},
      yAxis:[{type:'value', name:'Movimentação', axisLabel:{formatter:F.int}, nameTextStyle:{align:'left'}},
             {type:'value', name:'Base', axisLabel:{formatter:F.int}, splitLine:{show:false}, scale:true, nameTextStyle:{align:'right'}}],
      series:[
        {name:'Novos alunos', type:'bar', stack:'mov', barMaxWidth:26, data: ch.map((c, i) => ({value:c.novos, itemStyle:{opacity:dim(i)}})), itemStyle:{color:C.g300, borderColor:C.surface, borderWidth:1, borderRadius:0}},
        {name:'Cancelamentos', type:'bar', stack:'mov', barMaxWidth:26, data: ch.map((c, i) => ({value:c.cancel, itemStyle:{opacity:dim(i)}})), itemStyle:{color:C.r500, borderColor:C.surface, borderWidth:1, borderRadius:[4,4,0,0]}},
        {name:'Base final', type:'line', yAxisIndex:1, data: ch.map(c => c.fim), itemStyle:{color:C.r300}, lineStyle:{color:C.r300, width:2}},

  pieOrBar('planoPie', groupSum(V.al, a => a.plano), {name:'Alunos por plano', fmt: v => `${F.int(v)} aluno${v === 1 ? '' : 's'}`, color:B.colors.plano, filter:'plano'});

  const origs = uniq(V.al.map(a => a.origem));
  const stats = ['Ativo','Cancelado'].filter(s => V.al.some(a => a.status === s));
  draw('origemStatus', origs.length ? {
    grid:{left:8, right:8, top:36, bottom:8, containLabel:true},
    legend:{top:0, left:0},
    tooltip: axisTip(F.int),
    xAxis:{type:'category', data:origs},
    yAxis:{type:'value', minInterval:1},
    series: stats.map(s => ({name:s, type:'bar', barMaxWidth:30, barGap:'12%', itemStyle:{color:B.colors.status(s)}, label:{show:true, position:'top', color:C.text, fontSize:11, formatter: p => p.value || ''}, data: origs.map(o => V.al.filter(a => a.origem === o && a.status === s).length)})),
  } : {}, {empty: !origs.length, onClick: p => toggleFilter('origem', p.name)});

  renderAlunosTable(V);
}

const TBL = {q:'', sort:'id', dir:1, page:0};
const AL_COLS = [['id','ID','n'],['nome','Nome',''],['modalidade','Modalidade',''],['plano','Plano',''],['matricula','Matrícula',''],['mensalidade','Mensalidade','n'],['status','Status',''],['origem','Origem',''],['dias','Dias de casa','n']];
let lastV = null;
function renderAlunosTable(V){
  if (V) lastV = V; V = lastV;
  setBadge('alunosTable');
  const body = document.getElementById('hb-alunosTable');
  if (!body.dataset.init){
    body.dataset.init = '1';
    body.innerHTML = `<div class="tbl-tools"><label class="search">${icon('search')}<input type="search" id="alSearch" placeholder="Buscar aluno por nome…" aria-label="Buscar aluno por nome" autocomplete="off"></label><span class="tbl-count" id="alCount"></span></div><div class="tbl-wrap"><table class="t" id="alTable"><thead></thead><tbody></tbody></table></div><div class="pager" id="alPager"></div>`;
    body.querySelector('#alSearch').addEventListener('input', e => { TBL.q = e.target.value; TBL.page = 0; renderAlunosTable(); });
    body.querySelector('thead').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (!b) return; const s = b.dataset.s; TBL.dir = TBL.sort === s ? -TBL.dir : 1; TBL.sort = s; renderAlunosTable(); });
    body.querySelector('#alPager').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b){ TBL.page = +b.dataset.p; renderAlunosTable(); } });
  }
  const q = norm(TBL.q);
  let rows = V.al.map(a => ({...a, dias: daysSince(a)})).filter(a => !q || norm(a.nome).includes(q));
  const k = TBL.sort;
  rows.sort((a, b) => { const x = a[k], y = b[k]; if (x == null) return 1; if (y == null) return -1; return (x instanceof Date ? x - y : typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', {numeric:true})) * TBL.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / 10)); TBL.page = Math.min(TBL.page, pages - 1);
  const slice = rows.slice(TBL.page * 10, TBL.page * 10 + 10);
  body.querySelector('thead').innerHTML = `<tr>${AL_COLS.map(([c, l, n]) => `<th class="${n}" aria-sort="${TBL.sort === c ? (TBL.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-s="${c}">${l}<span class="s">${TBL.sort === c ? (TBL.dir > 0 ? '▲' : '▼') : ''}</span></button></th>`).join('')}</tr>`;
  body.querySelector('tbody').innerHTML = slice.length ? slice.map(a => `<tr><td class="n muted">${esc(a.id)}</td><td>${esc(a.nome)}</td><td>${esc(a.modalidade)}</td><td>${esc(a.plano)}</td><td>${F.date(a.matricula)}</td><td class="n">${F.brl(a.mensalidade)}</td><td><span class="badge ${a.status === 'Ativo' ? 'ativo' : 'cancelado'}">${a.status === 'Ativo' ? '● ' : '✕ '}${esc(a.status)}</span></td><td>${esc(a.origem)}</td><td class="n">${a.dias == null ? '—' : F.int(a.dias)}</td></tr>`).join('')
    : `<tr><td colspan="${AL_COLS.length}" style="text-align:center;padding:28px" class="muted">Sem dados para os filtros selecionados</td></tr>`;
  body.querySelector('#alCount').textContent = rows.length ? `Mostrando ${TBL.page * 10 + 1}–${TBL.page * 10 + slice.length} de ${rows.length}` : '0 alunos';
  const pg = body.querySelector('#alPager');
  pg.innerHTML = pages > 1 ? `<button type="button" data-p="${TBL.page - 1}" ${TBL.page === 0 ? 'disabled' : ''} aria-label="Página anterior">‹</button>${Array.from({length:pages}, (_, i) => `<button type="button" data-p="${i}" aria-current="${i === TBL.page}">${i + 1}</button>`).join('')}<button type="button" data-p="${TBL.page + 1}" ${TBL.page >= pages - 1 ? 'disabled' : ''} aria-label="Próxima página">›</button>` : '';
}

  renderKpis('sales', [

    {id:'cac', label:'CAC', sub:'Custo de aquisição por aluno', v:V.cacReal, f:F.brl, ref:`premissa ${F.brl(DATA.prem.cac)}`, trend: V.cacReal != null && V.cacReal > DATA.prem.cac ? {up:true, bad:true, t:'acima'} : null, tip:'Soma do CAC dos leads ÷ leads matriculados.', dec:'CAC alto: corte os canais caros e concentre o investimento nos que mais convertem.'},
    {id:'ltvcac', label:'LTV/CAC', sub:'Retorno do custo de aquisição', v:V.ltvCac, f:F.x, trend: V.ltvCac >= 3 ? {up:true, bad:false, t:'saudável'} : {up:false, bad:true, t:'abaixo de 3x'}, tip:'LTV ÷ CAC. Referência saudável: 3x ou mais.', dec:'Abaixo de 3x, a aquisição está cara. Acima de 5x, há espaço para investir mais em marketing.'},
  ]);
  if (!L.length){ ['funnel','leadOrigem','origemConv','convMod'].forEach(id => draw(id, {}, {empty:true})); renderPerdas(V); return; }

  const st = [['Leads', L.length, C.g500], ['Fizeram experimental', exp, C.r700], ['Compareceram', comp, C.r600], ['Matricularam', mat, C.r500]];
  const narrow = W('funnel') < 480;
  draw('funnel', {
    tooltip:{trigger:'item', formatter: p => { const i = p.dataIndex; return `<b>${p.name}</b>: ${F.int(p.value)}${i ? `<br>${F.pct(st[i-1][1] ? p.value / st[i-1][1] : 0)} da etapa anterior` : ''}<br>${F.pct(L.length ? p.value / L.length : 0)} do total de leads`; }},
    series:[{type:'funnel', sort:'none', left: '2%', width: narrow ? '50%' : '54%', top:8, bottom:8, minSize:'22%', gap:4, max: L.length,
      itemStyle:{borderColor:C.surface, borderWidth:2},

        rich:{n:{color:C.muted, fontSize:11.5, lineHeight:18}, v:{color:C.text, fontFamily:'Sora', fontSize:17, fontWeight:600}, p:{color:C.r300, fontSize:11}}},

  pieOrBar('leadOrigem', groupSum(L, l => l.origem), {name:'Leads por origem', fmt: v => `${F.int(v)} lead${v === 1 ? '' : 's'}`, color:B.colors.origem, filter:'origem'});

  const og = uniq(L.map(l => l.origem));

    xAxis:{type:'category', data:og},
    yAxis:{type:'value', minInterval:1},
    series:[

      {name:'Matrículas', type:'bar', barMaxWidth:28, itemStyle:{color:C.r500}, data: conv.map(c => c.m)},

  const cmo = hbarOption(cm, {fmt:F.pct, labelFmt: p => `${F.pct0(p.value)}  {m|${cm[p.dataIndex].m}/${cm[p.dataIndex].n}}`, tip: p => `<b>${esc(p.name)}</b><br>Conversão: <b>${F.pct(p.value)}</b><br>${cm[p.dataIndex].m} matrícula(s) de ${cm[p.dataIndex].n} lead(s)`});
  cmo.xAxis.max = 1; cmo.grid.right = 80;
  draw('convMod', cmo, {onClick: p => toggleFilter('modalidade', p.name)});

  renderPerdas(V);
