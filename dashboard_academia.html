function renderPerdas(V){
  setBadge('perdas');
  const lost = V.leads.filter(l => !l.matriculou), g = groupSum(lost, l => l.status).sort((a, b) => b.value - a.value), mx = Math.max(1, ...g.map(x => x.value));
  document.getElementById('hb-perdas').innerHTML = lost.length ? `<div class="loss-total"><b>${F.int(lost.length)}</b>lead${lost.length > 1 ? 's' : ''} perdido${lost.length > 1 ? 's' : ''} · ${F.pct(V.leads.length ? lost.length / V.leads.length : 0)} do total</div>` +
    g.map(x => `<div class="lossrow"><span class="lt">${esc(x.name)}</span><span class="lv">${F.int(x.value)} <span class="muted" style="font:500 11px var(--f-body)">· ${F.pct0(x.value / lost.length)}</span></span><div class="bar" role="img" aria-label="${esc(x.name)}: ${x.value}"><i style="width:${x.value / mx * 100}%"></i></div></div>`).join('')
    : `<div class="empty" style="height:200px">${icon('check')}<span>${V.leads.length ? 'Nenhum lead perdido no filtro' : 'Sem dados para os filtros selecionados'}</span></div>`;
}

/* ---------- 7.5 Operação ---------- */
function groupMod(tur){
  const m = new Map();
  tur.forEach(t => { const g = m.get(t.modalidade) || {name:t.modalidade, alunos:0, rec:0, custo:0, turmas:0}; g.alunos += t.matriculados; g.rec += t.recPot; g.custo += t.custo; g.turmas++; m.set(t.modalidade, g); });
  return [...m.values()].map(g => ({...g, margem: g.rec - g.custo, pct: g.rec > 0 ? (g.rec - g.custo) / g.rec : null}));
}
function renderOps(V){
  const T = V.tur, cap = sum(T, 'capacidade'), mat = sum(T, 'matriculados'), pres = sum(T, 'presenca');
  renderKpis('ops', [
    {id:'turmas', label:'Turmas ativas', sub:'Grade em funcionamento', v:T.length, f:F.int, ref:`${uniq(T.map(t => t.modalidade)).length} modalidades · ${uniq(T.map(t => t.professor)).length} professores`, tip:'Turmas cadastradas na aba Turmas (respeita filtros de modalidade e professor).', dec:'Use o mapa de calor para ver onde a grade está cheia ou ociosa.'},
    {id:'cap', label:'Capacidade total', sub:'Vagas disponíveis', v:cap, f:F.int, ref:'soma das vagas por turma', tip:'Soma da capacidade das turmas.', dec:'Compare com os matriculados para saber quanto ainda dá para crescer sem investir em espaço.'},
    {id:'mat', label:'Matriculados', sub:'Vagas ocupadas', v:mat, f:F.int, ref:`${F.int(Math.max(0, cap - mat))} vagas livres`, tip:'Soma dos matriculados nas turmas.', dec:'Vagas livres são receita potencial: direcione campanhas para as turmas com sobra.'},
    {id:'ocup', label:'Taxa de ocupação', sub:'Uso da capacidade', v:V.ocupMedia, f:F.pct, trend: V.ocupMedia >= .8 ? {up:true, bad:false, t:'alta'} : V.ocupMedia < .5 ? {up:false, bad:true, t:'baixa'} : null, ref:'turmas com capacidade > 0', tip:'Média simples de Matriculados ÷ Capacidade, considerando só turmas com capacidade > 0.', dec:'Abaixo de 50%: junte turmas ou mude o horário. Acima de 80%: abra novas turmas.'},
    {id:'pres', label:'Taxa de presença', sub:'Matriculados que comparecem', v: mat ? pres/mat : 0, f:F.pct, ref:`${F.dec(pres)} presentes por aula`, tip:'Soma da presença média ÷ soma dos matriculados.', dec:'Queda de presença costuma anteceder cancelamentos: contate os alunos ausentes.'},
  ]);
  if (!T.length){ ['ocupTurma','heatmap','margemTurma'].forEach(id => draw(id, {}, {empty:true})); }
  else {
    const tc = V.tCap;
    draw('ocupTurma', tc.length ? {
      grid:{left:8, right:56, top:22, bottom:8, containLabel:true},
      tooltip:{trigger:'item', formatter: p => { const t = tc[p.dataIndex]; return `<b>${esc(t.codigo)}</b> · ${esc(t.modalidade)}<br>${esc(t.dia)} ${esc(t.horario)} · ${esc(t.professor)}<br>Ocupação: <b>${F.pct(t.ocup)}</b> (${t.matriculados}/${t.capacidade}) · ${t.status}`; }},
      xAxis:{type:'category', data: tc.map(t => t.codigo), axisLabel:{interval:0, rotate: W('ocupTurma') < 560 ? 45 : 0, fontSize:10.5}},
      yAxis:{type:'value', max: v => Math.max(1, Math.ceil(v.max * 10) / 10), axisLabel:{formatter: v => F.pct0(v)}},
      series:[{type:'bar', barMaxWidth:30, data: tc.map(t => ({value:t.ocup, itemStyle:{color:STATUS_COLOR[t.status]}})),
        label:{show:true, position:'top', color:C.text, fontSize:10.5, formatter: p => F.pct0(p.value)},
        markLine:{silent:true, symbol:'none', data:[{yAxis:.8, name:'Alta 80%'}, {yAxis:.5, name:'Média 50%'}], lineStyle:{color:C.g500, type:[4,4], width:1}, label:{position:'end', formatter:'{b}', color:C.muted, fontSize:10}}}],
    } : {}, {empty: !tc.length, onClick: p => toggleFilter('modalidade', tc[p.dataIndex].modalidade)});

    /* Heatmap dia × faixa */
    let faixas = DATA.ocupacao.filter(o => o.faixa).map(o => ({label:o.horario, s:o.faixa[0], e:o.faixa[1]}));
    T.forEach(t => { if (t.hour != null && !faixas.some(f => t.hour >= f.s && t.hour < f.e)) faixas.push({label:`${pad(t.hour)}h`, s:t.hour, e:t.hour + 1}); });
    faixas.sort((a, b) => a.s - b.s);
    const dayIdx = uniq([0,1,2,3,4,5, ...T.flatMap(t => t.days)]).sort((a, b) => a - b);
    const cells = {};
    T.forEach(t => { if (t.capacidade <= 0 || t.hour == null) return; const fi = faixas.findIndex(f => t.hour >= f.s && t.hour < f.e); t.days.forEach(d => { const k = d + '|' + fi; const c = cells[k] || {cap:0, mat:0, list:[]}; c.cap += t.capacidade; c.mat += t.matriculados; c.list.push(t.codigo); cells[k] = c; }); });
    const hd = [], bg = [];
    dayIdx.forEach((d, xi) => faixas.forEach((f, yi) => { const c = cells[d + '|' + yi]; bg.push([xi, yi, 0]); if (c) hd.push({value:[xi, yi, c.mat / c.cap], c}); }));
    draw('heatmap', {
      grid:{left:6, right:10, top:6, bottom:44, containLabel:true},
      tooltip:{trigger:'item', formatter: p => { if (p.seriesIndex === 0) return `${DAY_LABELS[dayIdx[p.value[0]]]} · ${faixas[p.value[1]].label}<br><span style="color:${C.muted}">Sem turma</span>`; const c = p.data.c; return `<b>${DAY_LABELS[dayIdx[p.value[0]]]} · ${faixas[p.value[1]].label}</b><br>Ocupação: <b>${F.pct(p.value[2])}</b> (${c.mat}/${c.cap})<br>Turmas: ${c.list.join(', ')}`; }},
      xAxis:{type:'category', data: dayIdx.map(d => DAY_LABELS[d]), splitArea:{show:false}, position:'top', axisLabel:{color:C.text}},
      yAxis:{type:'category', data: faixas.map(f => f.label), inverse:true},
      visualMap:{seriesIndex:1, min:0, max:1, calculable:false, orient:'horizontal', left:'center', bottom:0, itemWidth:10, itemHeight:140, text:['100%','0%'], textStyle:{color:C.muted, fontSize:10.5}, inRange:{color:['#3A2A2C', C.r700, C.r600, C.r500]}},
      series:[
        {type:'heatmap', data:bg, itemStyle:{color:'#18181B', borderColor:C.surface, borderWidth:3, borderRadius:4}, label:{show:true, formatter:'—', color:C.dim, fontSize:10}, emphasis:{disabled:true}},
        {type:'heatmap', data:hd, itemStyle:{borderColor:C.surface, borderWidth:3, borderRadius:4}, label:{show:true, color:C.text, fontSize:10.5, fontWeight:600, formatter: p => F.pct0(p.value[2])}, emphasis:{itemStyle:{borderColor:C.r200, borderWidth:1}}},
      ],
    }, {aria:'Mapa de calor de ocupação por dia da semana e faixa horária'});

    const mt = [...T].sort((a, b) => b.margem - a.margem);
    draw('margemTurma', {
      grid:{left:6, right:62, top:6, bottom:6, containLabel:true},
      tooltip:{trigger:'item', formatter: p => { const t = mt[p.dataIndex]; return `<b>${esc(t.codigo)}</b> · ${esc(t.modalidade)}<br>Receita potencial: ${F.brl0(t.recPot)}<br>Custo mensal: ${F.brl0(t.custo)}<br>Margem: <b>${F.brl0(t.margem)}</b>${t.margemPct != null ? ` (${F.pct(t.margemPct)})` : ''}`; }},
      xAxis:{type:'value', max: v => v.max > 0 ? v.max * 1.3 : 0, axisLabel:{formatter:F.brlc, fontSize:10}},
      yAxis:{type:'category', inverse:true, data: mt.map(t => t.codigo), axisLabel:{color:C.text, fontSize:11}},
      series:[{type:'bar', barMaxWidth:14, data: mt.map(t => ({value:t.margem, itemStyle:{color: t.margem < 0 ? C.r500 : C.g300, borderRadius: t.margem < 0 ? [4,0,0,4] : [0,4,4,0]}, label:{position: t.margem < 0 ? 'insideRight' : 'right'}})),
        label:{show:true, color:C.text, fontSize:10.5, formatter: p => F.brlc(p.value)},
        markLine:{silent:true, symbol:'none', data:[{xAxis:0}], lineStyle:{color:C.g500, type:'solid', width:1}, label:{show:false}}}],
    }, {onClick: p => toggleFilter('modalidade', mt[p.dataIndex].modalidade)});
  }

  /* Faixas horárias (aba Ocupacao_Horarios) */
  const O = DATA.ocupacao;
  draw('faixas', O.length ? {
    grid:{left:8, right:8, top:36, bottom:8, containLabel:true},
    legend:{top:0, left:0, data:['Capacidade','Matriculados','Presença média']},
    tooltip:{trigger:'axis', axisPointer:{type:'shadow', shadowStyle:{color:'rgba(255,255,255,.03)'}}, formatter: ps => { const o = O[ps[0].dataIndex]; return o.capacidade <= 0 ? `<b>${esc(o.horario)}</b><br><span style="color:${C.muted}">Sem turma — oportunidade de grade</span>` : `<b>${esc(o.horario)}</b> · ${o.status}<br>Capacidade: <b>${F.int(o.capacidade)}</b><br>Matriculados: <b>${F.int(o.matriculados)}</b> (${F.pct(o.ocup)})<br>Presença média: <b>${F.dec(o.presenca)}</b>`; }},
    xAxis:{type:'category', data: O.map(o => o.horario), axisLabel:{interval:0, fontSize:10.5, color: (v, i) => O[i] && O[i].capacidade <= 0 ? C.dim : C.muted}},
    yAxis:{type:'value', minInterval:1},
    series:[
      {name:'Capacidade', type:'bar', barMaxWidth:18, itemStyle:{color:C.g500}, data:O.map(o => o.capacidade),
        markArea:{silent:true, itemStyle:{color:'rgba(255,255,255,.025)'}, label:{show:true, position:'insideBottom', color:C.muted, fontSize:10, distance:8}, data: O.filter(o => o.capacidade <= 0).map(o => [{xAxis:o.horario, name:'sem\nturma'}, {xAxis:o.horario}])}},
      {name:'Matriculados', type:'bar', barMaxWidth:18, itemStyle:{color:C.r500}, data:O.map(o => o.matriculados)},
      {name:'Presença média', type:'bar', barMaxWidth:18, itemStyle:{color:C.r300}, data:O.map(o => o.presenca)},
    ],
  } : {}, {empty: !O.length});

  renderMargemMod(V); renderProfRank(V);
}
function renderMargemMod(V){
  setBadge('margemMod');
  const g = groupMod(V.tur).sort((a, b) => b.margem - a.margem), mx = Math.max(.01, ...g.map(x => Math.abs(x.pct || 0)));
  const tr = {alunos: sum(g, 'alunos'), rec: sum(g, 'rec'), custo: sum(g, 'custo')}; tr.margem = tr.rec - tr.custo; tr.pct = tr.rec ? tr.margem / tr.rec : 0;
  const el = document.getElementById('hb-margemMod');
  el.innerHTML = g.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Modalidade</th><th class="n">Alunos</th><th class="n">Receita potencial</th><th class="n">Custos diretos</th><th class="n">Margem R$</th><th class="n">Margem %</th></tr></thead><tbody>
    ${g.map(x => `<tr class="click" tabindex="0" data-f="modalidade" data-v="${esc(x.name)}"><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${BASE.colors.modalidade(x.name)};margin-right:8px"></span>${esc(x.name)}</td><td class="n">${F.int(x.alunos)}</td><td class="n">${F.brl0(x.rec)}</td><td class="n">${F.brl0(x.custo)}</td><td class="n${x.margem < 0 ? ' neg' : ''}">${F.brl0(x.margem)}</td><td class="n"><div class="mbar"><span class="${(x.pct || 0) < 0 ? 'neg' : ''}">${x.pct == null ? '—' : F.pct(x.pct)}</span><span class="trk"><span class="fil" style="display:block;width:${Math.min(100, Math.abs(x.pct || 0) / mx * 100)}%;background:${(x.pct || 0) < 0 ? C.r500 : C.g300}"></span></span></div></td></tr>`).join('')}
    <tr style="font-weight:600"><td>Total</td><td class="n">${F.int(tr.alunos)}</td><td class="n">${F.brl0(tr.rec)}</td><td class="n">${F.brl0(tr.custo)}</td><td class="n${tr.margem < 0 ? ' neg' : ''}">${F.brl0(tr.margem)}</td><td class="n${tr.pct < 0 ? ' neg' : ''}">${F.pct(tr.pct)}</td></tr></tbody></table></div>`

}
function renderProfRank(V){
  setBadge('profRank');
  const m = new Map();
  V.tur.forEach(t => { const g = m.get(t.professor) || {name:t.professor, turmas:0, mat:0, oc:[]}; g.turmas++; g.mat += t.matriculados; if (t.ocup != null) g.oc.push(t.ocup); m.set(t.professor, g); });
  const g = [...m.values()].map(x => ({...x, ocup: avg(x.oc)})).sort((a, b) => b.ocup - a.ocup);
  document.getElementById('hb-profRank').innerHTML = g.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Professor</th><th class="n">Turmas</th><th class="n">Matriculados</th><th class="n">Ocupação média</th></tr></thead><tbody>

/* ---------- 7.6 Projeções + simulador ---------- */
const SIM_FIELDS = [
  {k:'cresc', l:'Crescimento mensal', min:0, max:.15, step:.005, f:F.pct, tip:'Crescimento líquido mensal da base. O valor da planilha já considera o churn da premissa.'},
  {k:'churn', l:'Churn mensal', min:0, max:.15, step:.005, f:F.pct, tip:'Churn acima da premissa reduz o crescimento líquido na mesma proporção (e abaixo dela, aumenta). Também altera o LTV.'},
  {k:'ticket', l:'Ticket médio', min:80, max:400, step:5, f:F.brl0, tip:'Mensalidade média por aluno ativo.'},
  {k:'custoFixo', l:'Custos fixos mensais', min:5000, max:40000, step:500, f:F.brl0, tip:'Custos que não variam com o nº de alunos (aluguel, sistema, energia…).'},
  {k:'margem', l:'Margem de contribuição', min:.3, max:.9, step:.01, f:F.pct0, tip:'Percentual da receita que sobra após custos variáveis.'},

function defaultSim(){ const P = DATA.prem; return {cresc:P.cresc, churn:P.churn, ticket: BASE.ticketAll || P.mensLutas, custoFixo:P.custoFixo, margem:P.margem}; }
function buildSim(){
  const el = document.getElementById('hb-sim');
  el.innerHTML = `<div class="sim">${SIM_FIELDS.map(s => `<div class="sim-field"><div class="sim-top"><label for="s-${s.k}">${s.l} <button class="info" type="button" data-tip="${esc(s.tip)}" aria-label="Sobre ${esc(s.l)}">i</button></label><output id="o-${s.k}" for="s-${s.k}"></output></div>
    <input type="range" id="s-${s.k}" min="${s.min}" max="${s.max}" step="${s.step}"><div class="sim-range"><span>${s.f(s.min)}</span><span>${s.f(s.max)}</span></div></div>`).join('')}
    <button class="btn btn-ghost" type="button" id="simReset" style="justify-content:center">↺ Voltar às premissas da planilha</button>
    <div class="sim-note" id="simNote"></div></div>`;
  let raf = null;
  SIM_FIELDS.forEach(s => el.querySelector('#s-' + s.k).addEventListener('input', e => { state.sim[s.k] = +e.target.value; paintSim(); if (!raf) raf = requestAnimationFrame(() => { raf = null; const a = ANIM; ANIM = false; renderProj(); ANIM = a; }); }));
  el.querySelector('#simReset').addEventListener('click', () => { state.sim = defaultSim(); syncSim(); renderProj(); toast('Simulador voltou às premissas da planilha'); });
}
function paintSim(){
  SIM_FIELDS.forEach(s => { const inp = document.getElementById('s-' + s.k), v = state.sim[s.k]; document.getElementById('o-' + s.k).textContent = s.f(v); inp.style.setProperty('--p', ((v - s.min) / (s.max - s.min) * 100) + '%'); });
}
function syncSim(){ SIM_FIELDS.forEach(s => { document.getElementById('s-' + s.k).value = state.sim[s.k]; }); paintSim(); }
function renderProj(){

    {id:'alPE', label:'Alunos para o break-even', sub:'Base mínima para empatar', v:pr.alunosPE, f:F.int, ref:`${F.brl0(pr.pe)} ÷ ticket ${F.brl0(s.ticket)}`, tip:'Ponto de equilíbrio em R$ ÷ ticket médio simulado.', dec:'Transforme esse número na meta mínima do time comercial.'},
    {id:'ltvS', label:'LTV simulado', sub:'Valor do aluno no cenário', v:pr.ltv, f:F.money, ref:`crescimento líquido ${pr.gNet >= 0 ? '+' : ''}${F.pct(pr.gNet)} a.m.`, tip:'Ticket × margem ÷ churn, com os valores do simulador.', dec:'Compare com o CAC: o LTV deve ser pelo menos 3x o custo de conquistar o aluno.'},

    tooltip:{trigger:'axis', axisPointer:{type:'line', lineStyle:{color:'#3A3A3F'}}, formatter: ps => { const i = ps[0].dataIndex, r = R[i]; return `<b>${L[i]}</b><br>Faturamento mensal: <b>${F.money(r.fat)}</b><br>Acumulado: <b>${F.money(r.acum)}</b><br>Ponto de equilíbrio: ${F.money(pr.pe)} · ${F.pct(pr.pe ? r.fat / pr.pe : 0)} atingido<br>Resultado do mês: <b style="color:${r.res < 0 ? C.r300 : C.text}">${F.money(r.res)}</b>`; }},
    xAxis:{type:'category', data:L, boundaryGap:false},
    yAxis:[{type:'value', name:'Mensal', max: v => Math.max(v.max, pr.pe) * 1.08, axisLabel:{formatter:F.brlc}, nameTextStyle:{align:'left'}},
           {type:'value', name:'Acumulado', axisLabel:{formatter:F.brlc}, splitLine:{show:false}, max: accMax ? undefined : 1, nameTextStyle:{align:'right'}}],
    series:[
      {name:'Faturamento acumulado', type:'line', yAxisIndex:1, data:R.map(r => r.acum), symbol:'none', itemStyle:{color:C.r400}, lineStyle:{color:C.r400, width:1.5}, areaStyle:{color:gradient(.35)}, z:1},
      {name:'Faturamento mensal', type:'line', yAxisIndex:0, data:R.map(r => r.fat), itemStyle:{color:C.g300}, lineStyle:{color:C.g300, width:2.5}, z:3},
      {name:'Ponto de equilíbrio', type:'line', yAxisIndex:0, data:R.map(() => pr.pe), symbol:'none', itemStyle:{color:C.r300}, lineStyle:{color:C.r300, type:[6,4], width:1.5}, z:2},

  const meta = P.meta;

    xAxis:{type:'category', data:L},

      label:{show:true, position:'top', color:C.text, fontSize:10.5, formatter: p => F.int(p.value)},
      markLine:{silent:true, symbol:'none', data:[{yAxis:meta}], lineStyle:{color:C.r300, type:[6,4], width:1.5}, label:{formatter:`Meta ${F.int(meta)}`, position:'insideEndTop', color:C.r300, fontSize:10.5}},
      markPoint: pr.metaIdx >= 0 ? {symbol:'pin', symbolSize:38, itemStyle:{color:C.r300}, label:{color:C.bg, fontSize:9, formatter:'meta'}, data:[{coord:[pr.metaIdx, R[pr.metaIdx].alunos]}]} : undefined}],
  });
  document.getElementById('simNote').innerHTML = `Base inicial: <b style="color:var(--text)">${F.int(BASE.ativosAll)} alunos ativos</b> (aba Alunos). Crescimento líquido aplicado: <b style="color:var(--text)">${pr.gNet >= 0 ? '+' : ''}${F.pct(pr.gNet)} ao mês</b>.`;
}

const RENDER = {overview: renderOverview, finance: renderFinance, students: renderStudents, sales: renderSales, ops: renderOps, proj: () => renderProj()};
const dirty = new Set();
function renderAll(){ PAGES.forEach(p => dirty.add(p.id)); renderPage(state.tab); }
function renderPage(id){
  if (!DATA) return;
  const V = computeView();
  try { RENDER[id](V); } catch (e) { console.error('Falha ao renderizar', id, e); }
  dirty.delete(id);
}
function resizePage(id){ const pg = document.getElementById('page-' + id); Object.entries(charts).forEach(([k, c]) => { if (pg.contains(c.getDom())) c.resize(); }); }
function buildTabs(){
  document.getElementById('tabs').innerHTML = PAGES.map(p => `<button class="tab" role="tab" type="button" id="tab-${p.id}" data-tab="${p.id}" aria-controls="page-${p.id}" aria-selected="false">${p.label}</button>`).join('');
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  document.getElementById('tabs').addEventListener('keydown', e => {
    if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
    const i = PAGES.findIndex(p => p.id === state.tab), n = PAGES[(i + (e.key === 'ArrowRight' ? 1 : -1) + PAGES.length) % PAGES.length];
    setTab(n.id); document.getElementById('tab-' + n.id).focus();
  });
  const mob = makeDropdown({label:'Página', options: PAGES.map(p => ({value:p.id, label:p.label})), value: state.tab, onChange: v => setTab(v)});
  document.getElementById('tabsMobile').appendChild(mob); ddRefs._tab = mob;
}
function setTab(id, initial){
  state.tab = id;
  document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === id));
  ddRefs._tab?._set(id);
  save();
  const mh = document.querySelector('.masthead').offsetHeight;
  if (!initial && window.scrollY > mh) window.scrollTo({top: mh, behavior: ANIM ? 'smooth' : 'auto'});
  if (dirty.has(id)) renderPage(id); else resizePage(id);
}
function setData(book, sourceLabel){
  const {data, warn} = loadBook(book);
  const needed = ['Alunos','Turmas','Receitas','Despesas','Leads'];
  if (needed.every(n => !getSheet(book, n))) throw new Error('A planilha não contém as abas do modelo (Alunos, Turmas, Receitas, Despesas, Leads).');
  DATA = data; BASE = buildBase(DATA);
  sanitizeFilters(); buildFilterUI(); renderChips();
  state.sim = defaultSim(); syncSim();
  showWarnings(warn);
  document.getElementById('updated').innerHTML = `<b>Dados até ${F.date(BASE.lastDate)}</b>${esc(sourceLabel)}`;
  renderAll();
}
function sheetsFromWorkbook(wb){
  const out = {};
  wb.SheetNames.forEach(n => { out[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false}); });
  return out;
}

/* Upload */
document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (!window.XLSX){ showWarnings(['Não foi possível carregar o leitor de Excel (SheetJS). Verifique a conexão com a internet e recarregue a página.'], 'Falha ao ler a planilha'); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    setData(sheetsFromWorkbook(wb), `Arquivo: ${file.name}`);
    toast(`Planilha “${file.name}” carregada — painel recalculado`);
  } catch (err) {
    console.error(err);
    showWarnings([err.message || 'Arquivo inválido.', 'Os dados anteriores foram mantidos.'], 'Não foi possível ler a planilha');
  }
});

document.addEventListener('click', e => {
  closeAllDropdowns();
  if (!morePanel.hidden && !morePanel.contains(e.target) && !btnMore.contains(e.target)){ morePanel.hidden = true; btnMore.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !morePanel.hidden){ morePanel.hidden = true; btnMore.setAttribute('aria-expanded', 'false'); btnMore.focus(); } });
document.getElementById('chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) setFilter(c.dataset.k, null); });
document.getElementById('btnClear').addEventListener('click', () => { clearFilters(); toast('Filtros limpos'); });
document.getElementById('bannerX').addEventListener('click', () => document.getElementById('banner').hidden = true);
/* Linhas clicáveis (cross-filter nas tabelas) */
document.getElementById('main').addEventListener('click', e => { const r = e.target.closest('tr.click'); if (r) toggleFilter(r.dataset.f, r.dataset.v); });
document.getElementById('main').addEventListener('keydown', e => { const r = e.target.closest('tr.click'); if (r && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleFilter(r.dataset.f, r.dataset.v); } });
document.getElementById('ftInfo').dataset.tip = 'Correções aplicadas: (1) LTV = ticket × margem ÷ churn; (2) ticket médio só com ativos; (3) margem por modalidade com receita potencial das turmas; (4) churn real do período × churn mensal das séries; (5) DRE usa Despesas reais no mês realizado; (6) ocupação média só com capacidade > 0; (7) ponto de equilíbrio também em nº de alunos; (8) LTV/CAC e inadimplência.';

/* Redimensionamento */
let rzT, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  resizePage(state.tab);
  if (Math.abs(window.innerWidth - lastW) > 40){ lastW = window.innerWidth; const a = ANIM; ANIM = false; PAGES.forEach(p => dirty.add(p.id)); renderPage(state.tab); ANIM = a; }
}, 140); });

/* Exportar PDF */
document.getElementById('btnPdf').addEventListener('click', () => {
  if (!DATA) return;
  const a = ANIM; ANIM = false;
  document.body.classList.add('printing');
  PAGES.forEach(p => { document.getElementById('page-' + p.id).style.display = 'block'; renderPage(p.id); });
  Object.values(charts).forEach(c => c.resize());
  setTimeout(() => window.print(), 250);
  const done = () => {
    document.body.classList.remove('printing');
    PAGES.forEach(p => document.getElementById('page-' + p.id).style.display = '');
    ANIM = a; PAGES.forEach(p => dirty.add(p.id)); renderPage(state.tab);
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
});

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
(function init(){
  restore();
  buildTabs(); buildPages(); buildSim();
  setTab(state.tab, true);
  if (!window.echarts){ showWarnings(['Não foi possível carregar a biblioteca de gráficos (ECharts). Verifique a conexão com a internet e recarregue a página.'], 'Gráficos indisponíveis'); return; }
  try { setData(EMBEDDED || {}, 'Planilha embutida'); }
  catch (e) { console.error(e); showWarnings([e.message], 'Não foi possível ler os dados embutidos'); }
})();
</script>
